#
# Ansible managed -- roles/vcp-cluster/templates/sites-infra-namespace.yaml.j2
#
# The namespace on the infra cluster that every all-VM cluster's nodes live in.
# Shared by all of them, so it is written by each site and is the same file each
# time -- Argo CD applying it twice is a no-op.
apiVersion: v1
kind: Namespace
metadata:
  name: acm-vcp-vms
  annotations:
    # Before anything placed into it, for the same reason the hub half of the
    # site carries one: Argo CD can otherwise try to apply a namespaced object
    # before the namespace exists and fail the whole sync.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    tnf-toolbox-gp/owner: acm-vcp
    # Opts the namespace into a primary user-defined network. Without it the UDN
    # is created and ignored, and the VMs come up on the default pod network --
    # which is the failure this exists to prevent, and it is silent.
    #
    # It only affects pods created after it, so a namespace that already holds
    # running VMs needs them recreated, not just relabelled.
    k8s.ovn.org/primary-user-defined-network: ""
