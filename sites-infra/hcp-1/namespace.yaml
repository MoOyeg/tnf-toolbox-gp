#
# Ansible managed -- roles/hcp-guest/templates/sites-infra-hcp-namespace.yaml.j2
#
# The namespace on the infra cluster that hosted clusters are created in.
#
# Deliberately 'clusters' and not acm-hosted-vms: that one is where the *hub*
# used to put VMs it owned from across the peering, and two HyperShift operators
# reconciling one namespace would each believe they owned it. This cluster's
# own MultiCluster Engine owns this one.
#
# Shared by every guest hosted here, so each site writes the same file and Argo
# CD applying it twice is a no-op.
apiVersion: v1
kind: Namespace
metadata:
  name: clusters
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    tnf-toolbox-gp/owner: hcp-guests
