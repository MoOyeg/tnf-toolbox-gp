---
# Red Hat AI Inference Server: vLLM, packaged and supported by Red Hat.
#
# Serving a vision-language model rather than a detector, because this is the
# slow path -- it is asked about frames the fast path has already flagged, and
# what it returns is a sentence a line supervisor can act on, not a number.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: visual-inspection-1
  name: vllm
  labels: {app.kubernetes.io/name: vllm, app.kubernetes.io/part-of: inspection}
spec:
  replicas: 1
  # Same reason as the analyzer: pulling a 12 GiB image and then several GiB of
  # model weights runs past the 600s default, and the Deployment failing its
  # own progress deadline fails the rollout regardless of the probe.
  progressDeadlineSeconds: 3600
  # Recreate, not the default RollingUpdate. The model volume is
  # ReadWriteOnce, so a replacement pod scheduled to a different node cannot
  # attach it while the outgoing pod still holds it -- and RollingUpdate will
  # not release the outgoing pod until the replacement is Ready. The two wait
  # on each other until the progress deadline expires. Recreate takes the old
  # pod down first, which costs a few seconds of downtime and is the only
  # arrangement that can actually complete.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: vllm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: vllm}
    spec:
      # The Service below is called 'vllm', so Kubernetes injects the legacy
      # Docker-link variables for it -- including VLLM_PORT=tcp://<clusterIP>:8000.
      # vLLM reads VLLM_PORT as its own configuration and wants an integer, so it
      # dies on start with "appears to be a URI". The service name and the
      # server's own env namespace collide, and the pod loses.
      #
      # Turning the links off is narrower than renaming the Service: nothing here
      # needs them, and a rename would ripple into the analyzer's VLLM_URL and
      # anything else pointing at http://vllm:8000.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.1
          args:
            - --model=$(MODEL)
            - --served-model-name=$(MODEL)
            - --port=8000
            # Turing has no bfloat16. Most VLM configs ask for it, and vLLM
            # aborts on a T4 unless this overrides them.
            - --dtype=float16
            # The vision tower sits on top of the weights in the same 16 GB, so
            # the context is kept modest rather than defaulted.
            - --max-model-len=4096
            - --gpu-memory-utilization=0.90
            - --limit-mm-per-prompt={"image":1}
          env:
            - name: MODEL
              value: Qwen/Qwen2.5-VL-3B-Instruct
            # FlashAttention 2 is Ampere and later. Left to itself vLLM picks a
            # backend the T4 cannot run and fails at startup, well after the
            # model has finished downloading.
            - name: VLLM_ATTENTION_BACKEND
              value: XFORMERS
            # The RHAIIS image ships HF_HUB_OFFLINE=1 -- a sensible default for a
            # supported, air-gapped-by-default server, and fatal here. The model
            # is pulled from the Hub on first start, and huggingface_hub refuses
            # to use a working connection while it is set. The failure surfaces
            # as vLLM's "Invalid repository ID or local directory specified",
            # which reads like a typo in the model name rather than a policy.
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: HF_HOME
              value: /models
          ports:
            - {name: http, containerPort: 8000}
          resources:
            limits: {nvidia.com/gpu: "1", memory: 24Gi, cpu: "8"}
            requests: {nvidia.com/gpu: "1", memory: 8Gi, cpu: "2"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            # Cold start pulls several GB and builds the graph; a tighter probe
            # kills the pod mid-download and it never converges.
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 60
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        # Persisted so a restart does not re-download the model.
        - name: models
          persistentVolumeClaim: {claimName: vllm-models}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: visual-inspection-1
  name: vllm-models
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 40Gi}}
---
apiVersion: v1
kind: Service
metadata:
  namespace: visual-inspection-1
  name: vllm
spec:
  selector: {app.kubernetes.io/name: vllm}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
