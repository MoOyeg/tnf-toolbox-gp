---
# MediaMTX: a real RTSP server, so every consumer downstream speaks to the
# cameras exactly as it would to hardware. Nothing in the pipeline has a
# "simulation" code path to remove later.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtsp-server
  labels: {app.kubernetes.io/name: rtsp-server, app.kubernetes.io/part-of: inspection}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rtsp-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rtsp-server}
    spec:
      containers:
        - name: mediamtx
          image: docker.io/bluenviron/mediamtx:latest
          env:
            - {name: MTX_PROTOCOLS, value: tcp}
            - {name: MTX_RTSPADDRESS, value: ":8554"}
          ports:
            - {name: rtsp, containerPort: 8554}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: rtsp-server
spec:
  selector: {app.kubernetes.io/name: rtsp-server}
  ports:
    - {name: rtsp, port: 8554, targetPort: 8554}
