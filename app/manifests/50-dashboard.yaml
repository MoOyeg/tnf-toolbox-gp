---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: {app.kubernetes.io/name: dashboard, app.kubernetes.io/part-of: inspection}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: dashboard}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dashboard}
    spec:
      containers:
        - name: dashboard
          image: REPLACED_BY_KUSTOMIZE/dashboard:latest
          env:
            - {name: ANALYZER_URL, value: "http://analyzer:8080"}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector: {app.kubernetes.io/name: dashboard}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard
spec:
  to: {kind: Service, name: dashboard}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
