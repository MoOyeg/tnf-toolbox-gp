                      # cluster's pull secret and SSH key, so only ciphertext is
                      # allowed to travel.
                      url: '{{hub (lookup "agent-install.openshift.io/v1beta1" "InfraEnv" "vcp-1" "vcp-1").status.isoDownloadURL | protect hub}}'
                      certConfigMap: vcp-1-hub-ca
                  storage:
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests:
                        storage: 8Gi
                    storageClassName: lvms-vg1
            - complianceType: musthave
              objectDefinition:
                apiVersion: kubevirt.io/v1
                kind: VirtualMachine
                metadata:
                  name: vcp-1-cp-2
                  namespace: acm-vcp-vms
                  labels:
                    tnf-toolbox-gp/cluster: vcp-1
                    tnf-toolbox-gp/role: control-plane
                spec:
