                          labelSelector:
                            matchLabels:
                              tnf-toolbox-gp/cluster: vcp-1
                        # And again over the control-plane machines alone, this
                        # one a requirement rather than a preference. The
                        # constraint above balances the cluster as a whole, which
                        # an even split satisfies with every master on one infra
                        # node and every worker on the other -- a node lost would
