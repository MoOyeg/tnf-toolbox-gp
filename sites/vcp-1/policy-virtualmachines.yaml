                        # unbalanced control plane that schedules cleanly is
                        # neither. Three masters over two infra nodes leaves
                        # 2/1 satisfiable with either node down to its last
                        # slot, so this blocks nothing a healthy rig can place.
                        - maxSkew: 1
                          topologyKey: kubernetes.io/hostname
                          whenUnsatisfiable: DoNotSchedule
                          labelSelector:
                            matchLabels:
                              tnf-toolbox-gp/cluster: vcp-1
                              tnf-toolbox-gp/role: control-plane
                      domain:
                        cpu:
                          cores: 10
                        memory:
                          guest: 32Gi
                        devices:
                          disks:
                            - name: root
                              bootOrder: 1
                              disk:
                                bus: virtio
                            # Second, and it matters: a node that reboots into
