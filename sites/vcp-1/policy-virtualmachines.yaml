              objectDefinition:
                apiVersion: kubevirt.io/v1
                kind: VirtualMachine
                metadata:
                  name: vcp-1-cp-3
                  namespace: acm-vcp-vms
                  labels:
                    tnf-toolbox-gp/cluster: vcp-1
                    tnf-toolbox-gp/role: control-plane
                spec:
                  running: true
                  dataVolumeTemplates:
                    - metadata:
                        name: vcp-1-cp-3-root
                      spec:
                        storage:
                          accessModes: [ReadWriteOnce]
