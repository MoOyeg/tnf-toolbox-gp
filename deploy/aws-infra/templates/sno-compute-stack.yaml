---
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  The single bare-metal node that runs the ACM cluster.

  Bare metal rather than a normal instance because this cluster runs OpenShift
  Virtualization, which needs KVM -- not available on a virtualised EC2 instance.
  No GPU is required here: the GPUs belong to the TNF site, and the ACM cluster
  reaches them through the peering connection by creating VMs there.

  Single-node OpenShift installs via bootstrap-in-place: the node boots the RHCOS
  AMI with an ignition config that installs a full control plane onto itself, so
  there is no separate bootstrap machine as there is for the TNF cluster.

Parameters:
  ClusterName:
    Type: String
    AllowedPattern: '[a-z0-9][-a-z0-9]{0,24}[a-z0-9]'
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  ClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  AvailabilityZone:
    Type: String
  RhcosAmi:
    Type: AWS::EC2::Image::Id
  SnoInstanceType:
    Type: String
    Default: m5zn.metal
  SshKeyName:
    Type: AWS::EC2::KeyPair::KeyName
  SnoPrivateIp:
    Type: String
  SnoUserData:
    Type: String
    Description: >-
      Ignition pointer for the single node. Fetches the bootstrap-in-place config
      from the ACM site's own bastion and sets /etc/hostname, exactly as the TNF
      control-plane nodes do.
    NoEcho: true
  RootVolumeSizeGiB:
    Type: Number
    Default: 200
  DataVolumeSizeGiB:
    Type: Number
    Default: 300

Resources:
  Sno:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref RhcosAmi
      InstanceType: !Ref SnoInstanceType
      KeyName: !Ref SshKeyName
      SubnetId: !Ref SubnetId
      PrivateIpAddress: !Ref SnoPrivateIp
      SecurityGroupIds:
        - !Ref ClusterSecurityGroupId
      UserData:
        Fn::Base64: !Ref SnoUserData
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSizeGiB
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-sno'
        - Key: tnf-cluster
          Value: !Ref ClusterName
        - Key: tnf-role
          Value: sno

  # Separate from the root volume so that rebuilding the node does not destroy
  # the storage ACM and any hosted etcd sit on. Attached at /dev/sdf for the same
  # reason as the TNF nodes: instance store already occupies the early names.
  SnoDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Delete
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Size: !Ref DataVolumeSizeGiB
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-sno-data'
        - Key: tnf-cluster
          Value: !Ref ClusterName

  SnoDataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Sno
      VolumeId: !Ref SnoDataVolume
      Device: /dev/sdf

Outputs:
  SnoInstanceId:
    Value: !Ref Sno
  SnoPrivateIp:
    Value: !Ref SnoPrivateIp
  SnoDataVolumeId:
    Value: !Ref SnoDataVolume
