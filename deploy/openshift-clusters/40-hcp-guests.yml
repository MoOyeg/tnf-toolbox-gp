---
# Stage 4: create the virtualized control-plane guest clusters, each with real
# T4s passed through into its worker VMs.
- name: Create the guest clusters
  hosts: bastion
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    # The fallback must list the system sbin directories. A play's
    # environment: applies to the implicit fact gathering too, so on that first
    # task ansible_env is still undefined and the default is what PATH becomes
    # -- and the setup module then reports *that* as ansible_env.PATH for every
    # task after it. A short fallback silently loses /usr/sbin for the whole
    # play, and tools like haproxy stop being found.
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"

  tasks:
    - name: Discover the passthrough GPU resource name
      ansible.builtin.include_role:
        name: common
        tasks_from: discover-gpu-resource
      vars:
        op_kubeconfig: "{{ kubeconfig }}"

    - name: Check the GPU budget before creating anything
      # Identical indentation on every line: see the note in roles/cnv.
      ansible.builtin.shell: >-
        set -o pipefail;
        oc get nodes -o json
        | jq -r --arg r "{{ gpu_resource_name }}"
        '[.items[].status.allocatable[$r] // "0" | tonumber] | add'
      register: gpu_budget
      changed_when: false

    # Creating clusters that cannot possibly schedule wastes half an hour before
    # failing, so the arithmetic happens up front.
    - name: Fail if the guest clusters would ask for more GPUs than exist
      ansible.builtin.assert:
        that: >-
          (guest_cluster_count | int) * (guest_nodepool_replicas | int)
          * (guest_gpus_per_node | int) <= (gpu_budget.stdout | trim | int)
        fail_msg: >-
          {{ guest_cluster_count }} guest cluster(s) x
          {{ guest_nodepool_replicas }} worker(s) x {{ guest_gpus_per_node }} GPU(s)
          needs {{ (guest_cluster_count | int) * (guest_nodepool_replicas | int) * (guest_gpus_per_node | int) }}
          of {{ gpu_resource_name }}, but only {{ gpu_budget.stdout | trim }} are
          allocatable. Either lower GUEST_GPUS_PER_NODE, or move a node to
          vm-passthrough in config/instance.env.
        success_msg: >-
          {{ (guest_cluster_count | int) * (guest_nodepool_replicas | int) * (guest_gpus_per_node | int) }}
          of {{ gpu_budget.stdout | trim }} passthrough GPUs will be used.

    - name: Create the guest clusters
      ansible.builtin.include_role:
        name: hcp-guest
      vars:
        op_kubeconfig: "{{ kubeconfig }}"

# ---------------------------------------------------------------------------
# Stage 4b: hand the guests to the ACM hub.
#
# TNF hosts them; ACM manages them. Those are different jobs and, until this
# play, only the first was being done.
#
# The hub used to get this for free. While the HostedCluster was created on the
# ACM cluster, MCE's hypershift addon auto-imported it into the hub that created
# it. Creating it on TNF moves that auto-import to TNF's own MCE, which produces
# a ManagedCluster nothing ever finishes -- accepted by the hub, klusterlet
# never installed, Available=Unknown forever -- and leaves ACM with no knowledge
# of the cluster at all. The console then shows no GPUs for a guest that has
# six, and a fleet Placement selecting on tnf-toolbox-gp/fleet does not reach it.
#
# So auto-import on TNF is switched off in mce-only.yml, and the guests are
# imported here into the hub that is actually meant to manage them.
- name: Import the guest clusters into the ACM hub
  hosts: acm_bastion
  gather_facts: false
  environment:
    KUBECONFIG: "{{ acm_kubeconfig }}"
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"

  tasks:
    - name: Check whether the ACM hub exists
      ansible.builtin.stat:
        path: "{{ acm_kubeconfig }}"
      register: hub_kubeconfig

    # Not a failure. 'make guests' is usable on its own against a TNF site with
    # no ACM site beside it, and a guest that nothing manages is still a working
    # guest -- so this reports and stops rather than failing a build that did
    # everything it was asked to.
    - name: Report that there is no hub to import into
      ansible.builtin.debug:
        msg: >-
          No ACM kubeconfig at {{ acm_kubeconfig }}, so the guest clusters are
          not being imported. They are running on TNF regardless; run
          'make acm-site' and then this stage again to have the hub manage them.
      when: not hub_kubeconfig.stat.exists

    - name: Import each guest
      ansible.builtin.include_tasks: tasks/import-guest.yml
      vars:
        # This stage created the guests a moment ago, so a missing kubeconfig
        # is a real failure rather than "not built yet".
        guest_import_required: true
      loop: "{{ range(1, (guest_cluster_count | int) + 1) | list }}"
      loop_control:
        loop_var: guest_index
        label: "{{ guest_cluster_prefix }}-{{ guest_index }}"
      when: hub_kubeconfig.stat.exists
