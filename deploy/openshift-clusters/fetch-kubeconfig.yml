---
# Copy the base cluster and guest kubeconfigs back to the workstation.
#
# The names resolve publicly: the cluster's records live in the account's public
# Route53 zone and point at the bastion's elastic IP, so the kubeconfig works as
# fetched -- no /etc/hosts, and no --insecure-skip-tls-verify, because the
# installer issued the certificate for that exact name.
#
# Cluster nodes still resolve the same names to the bastion's private address,
# via the more specific VPC-associated private zone.
#
# Both sites, each from its own bastion. A site that has not been built yet has
# no kubeconfig, and is skipped rather than failed -- 'make kubeconfig' runs
# right after 'make tnf' in the pipeline, long before the ACM cluster exists.
- name: Fetch kubeconfigs
  hosts: bastion:acm_bastion
  gather_facts: false
  vars:
    is_acm: "{{ inventory_hostname in groups['acm_bastion'] | default([]) }}"
    site_name: "{{ acm_cluster_name if is_acm | bool else cluster_name }}"
    site_install_dir: "{{ acm_install_dir if is_acm | bool else install_dir }}"
    site_kubeconfig: "{{ acm_kubeconfig if is_acm | bool else kubeconfig }}"
    site_domain: >-
      {{ (acm_cluster_name ~ '.' ~ base_domain) if is_acm | bool else cluster_domain }}

  tasks:
    - name: Look for this site's kubeconfig
      ansible.builtin.stat:
        path: "{{ site_kubeconfig }}"
      register: site_kubeconfig_stat

    # The file proves nothing on its own: 'openshift-install create
    # ignition-configs' writes auth/kubeconfig, so an attempt that never
    # produced a cluster leaves one behind. Fetching that hands out a
    # credential for something that does not exist. Ask the cluster.
    - name: Ask this site's cluster whether it is really installed
      ansible.builtin.command: >-
        oc --request-timeout=15s get clusterversion version
        -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
      environment:
        KUBECONFIG: "{{ site_kubeconfig }}"
        PATH: "{{ bin_dir }}:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
      register: site_clusterversion
      changed_when: false
      failed_when: false
      when: site_kubeconfig_stat.stat.exists

    - name: Record whether this site is built
      ansible.builtin.set_fact:
        site_built: >-
          {{ site_kubeconfig_stat.stat.exists
             and site_clusterversion.rc | default(1) == 0
             and site_clusterversion.stdout | default('') == 'True' }}

    - name: Report a site that is not built yet
      ansible.builtin.debug:
        msg: "{{ site_name }} is not installed yet; skipping it."
      when: not site_built | bool

    - name: Create the local destination
      ansible.builtin.file:
        path: "{{ repo_root }}/deploy/clusters/{{ site_name }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      when: site_built | bool

    - name: Fetch the cluster kubeconfig
      ansible.builtin.fetch:
        src: "{{ site_kubeconfig }}"
        dest: "{{ repo_root }}/deploy/clusters/{{ site_name }}/kubeconfig"
        flat: true
      when: site_built | bool

    - name: Fetch the kubeadmin password
      ansible.builtin.fetch:
        src: "{{ site_install_dir }}/auth/kubeadmin-password"
        dest: "{{ repo_root }}/deploy/clusters/{{ site_name }}/kubeadmin-password"
        flat: true
      failed_when: false
      when: site_built | bool

    - name: Find the guest kubeconfigs
      ansible.builtin.find:
        paths: "{{ install_root }}/guests"
        patterns: "*.kubeconfig"
      register: guest_kubeconfigs
      failed_when: false
      when: site_built | bool

    - name: Fetch the guest kubeconfigs
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ repo_root }}/deploy/clusters/{{ site_name }}/{{ item.path | basename }}"
        flat: true
      loop: "{{ guest_kubeconfigs.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # A guest cluster has no auth/ directory to copy from; its kubeadmin
    # password is a secret on the hub, in one of two places depending on what
    # built it. HyperShift keeps <guest>-kubeadmin-password in the hosted
    # clusters namespace. The assisted installer keeps <guest>-admin-password
    # in the guest's own namespace -- looking only in the first reported every
    # all-VM cluster as "not fetched".
    - name: Read each guest's kubeadmin password from the hub
      ansible.builtin.shell: >-
        set -o pipefail;
        g={{ item.path | basename | regex_replace('\.kubeconfig$', '') }};
        { oc --request-timeout=20s get secret "${g}-kubeadmin-password"
        -n {{ hcp_namespace }} -o jsonpath='{.data.password}' 2>/dev/null
        || oc --request-timeout=20s get secret "${g}-admin-password"
        -n "${g}" -o jsonpath='{.data.password}'; }
        | base64 -d
      environment:
        KUBECONFIG: "{{ site_kubeconfig }}"
      register: guest_passwords
      changed_when: false
      failed_when: false
      loop: "{{ guest_kubeconfigs.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Save the guest kubeadmin passwords
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: >-
          {{ repo_root }}/deploy/clusters/{{ site_name }}/{{
             item.item.path | basename | regex_replace('\.kubeconfig$', '')
          }}-kubeadmin-password
        mode: '0600'
      delegate_to: localhost
      loop: "{{ guest_passwords.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path | basename }}"
      when:
        - item.rc | default(1) == 0
        - item.stdout | default('') | length > 0

    # Proves the public record resolves and the API answers, from here rather
    # than from the bastion -- which is the whole claim being made.
    - name: Confirm the API is reachable from this workstation
      ansible.builtin.uri:
        url: "https://api.{{ site_domain }}:6443/version"
        validate_certs: false
        status_code: [200, 401, 403]
      delegate_to: localhost
      register: api_reachable
      retries: 10
      delay: 15
      until: api_reachable is not failed
      when: site_built | bool

    - name: Show how to use them
      when: site_built | bool
      ansible.builtin.debug:
        msg:
          - "Kubeconfigs are in deploy/clusters/{{ site_name }}/"
          - ""
          - "  export KUBECONFIG=deploy/clusters/{{ site_name }}/kubeconfig"
          - "  oc get nodes"
          - ""
          - "API:     https://api.{{ site_domain }}:6443  (reachable from here)"
          - "Console: https://console-openshift-console.apps.{{ site_domain }}"
          - "Login:   kubeadmin / (see deploy/clusters/{{ site_name }}/kubeadmin-password)"
          - ""
          - "The console certificate is the cluster's own self-signed ingress cert,"
          - "so a browser will warn. The API certificate is issued for this name and"
          - "validates, which is why oc needs no extra flags."

# One page listing every cluster this environment has, with the console, the
# API, the login and the absolute path to each kubeconfig. Without it the
# credentials are correct but scattered: two directories, a file per cluster,
# and nothing saying which URL any of them belongs to.
#
# It is written under deploy/clusters/, which is gitignored, because it contains
# kubeadmin passwords in plain text -- the same reason the password files
# themselves live there.
- name: Write the access page
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Build the access page from what was fetched
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os, sys, yaml, datetime
            root, domain, infra = sys.argv[1], sys.argv[2], sys.argv[3]
            base = os.path.join(root, "deploy", "clusters")

            def server_of(path):
                try:
                    with open(path) as fh:
                        return yaml.safe_load(fh)["clusters"][0]["cluster"]["server"]
                except Exception:
                    return None

            def read(path):
                try:
                    with open(path) as fh:
                        return fh.read().strip()
                    # noqa
                except OSError:
                    return None

            rows = []
            for site in sorted(os.listdir(base)) if os.path.isdir(base) else []:
                d = os.path.join(base, site)
                if not os.path.isdir(d):
                    continue
                kc = os.path.join(d, "kubeconfig")
                if os.path.exists(kc):
                    api = server_of(kc)
                    # api.<domain>:6443 -> <domain>; the console is on the
                    # matching apps wildcard.
                    host = (api or "").split("//")[-1].rsplit(":", 1)[0]
                    dom = host[4:] if host.startswith("api.") else host
                    rows.append({
                        "name": site,
                        "kind": "cluster",
                        "console": f"https://console-openshift-console.apps.{dom}" if dom else None,
                        "api": api,
                        "password": read(os.path.join(d, "kubeadmin-password")),
                        "kubeconfig": kc,
                        "note": None,
                    })
                for f in sorted(os.listdir(d)):
                    if not f.endswith(".kubeconfig"):
                        continue
                    guest = f[: -len(".kubeconfig")]
                    gkc = os.path.join(d, f)
                    gapi = server_of(gkc)
                    ghost = (gapi or "").split("//")[-1].rsplit(":", 1)[0]
                    if ghost.startswith("api."):
                        # A cluster with a domain of its own -- an all-VM one,
                        # whose API is published under api.<guest>.<base>. Its
                        # console follows from that exactly as a site's does.
                        # Deriving it from the host's domain instead gave
                        # apps.vcp-1.apps.tnf-gp..., which never resolved.
                        console = f"https://console-openshift-console.apps.{ghost[4:]}"
                        note = ("Published through its public load balancer, "
                                f"{guest}-pub-lb, which make sites creates.")
                    else:
                        # A hosted cluster: the API is a NodePort on a node of
                        # the cluster hosting its control plane, and its router
                        # is published on that cluster's apps wildcard, one
                        # level down.
                        console = f"https://console-openshift-console.apps.{guest}.apps.{domain}"
                        note = ("API is a NodePort on the hosting cluster's private "
                                "address: reachable from the bastions, not from your workstation.")
                    rows.append({
                        "name": guest,
                        "kind": "guest",
                        "console": console,
                        "api": gapi,
                        "password": read(os.path.join(d, f"{guest}-kubeadmin-password")),
                        "kubeconfig": gkc,
                        "note": note,
                    })

            # Infra cluster first, then the hub, then the guests they carry --
            # the order someone reads them in, not alphabetical.
            rows.sort(key=lambda r: (r["kind"] == "guest",
                                     r["name"] != infra,
                                     r["name"]))

            stamp = datetime.datetime.now().strftime("%Y-%m-%d %H:%M")
            out = [f"# Cluster access\n", f"_Generated {stamp} by `make kubeconfig`._\n",
                   "Every password below is the `kubeadmin` one. This file is gitignored.\n"]
            plain = []
            for r in rows:
                title = r["name"] if r["kind"] == "cluster" else f"{r['name']} (guest cluster)"
                out.append(f"\n## {title}\n")
                out.append("| | |")
                out.append("|---|---|")
                if r["console"]:
                    out.append(f"| Console | {r['console']} |")
                if r["api"]:
                    out.append(f"| API | `{r['api']}` |")
                out.append("| Username | `kubeadmin` |")
                out.append(f"| Password | `{r['password'] or 'not fetched'}` |")
                out.append(f"| Kubeconfig | `{r['kubeconfig']}` |")
                if r["note"]:
                    out.append(f"\n{r['note']}\n")
                out.append(f"\n```bash\nexport KUBECONFIG={r['kubeconfig']}\noc get nodes\n```")
                plain.append(f"  {title}")
                plain.append(f"    console    {r['console'] or '-'}")
                plain.append(f"    api        {r['api'] or '-'}")
                plain.append(f"    login      kubeadmin / {r['password'] or 'not fetched'}")
                plain.append(f"    kubeconfig {r['kubeconfig']}")

            page = os.path.join(base, "access.md")
            with open(page, "w") as fh:
                fh.write("\n".join(out) + "\n")
            os.chmod(page, 0o600)
            print("\n".join(plain))
            print(f"\n  Written to {page}")
          - "{{ repo_root }}"
          - "{{ cluster_domain }}"
          - "{{ cluster_name }}"
      register: access_page
      changed_when: true

    - name: Show the access page
      ansible.builtin.debug:
        msg: "{{ access_page.stdout_lines }}"
