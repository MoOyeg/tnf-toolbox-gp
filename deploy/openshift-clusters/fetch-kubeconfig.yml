---
# Copy the base cluster and guest kubeconfigs back to the workstation, and print
# the /etc/hosts entries needed to use them.
#
# api and *.apps resolve through a Route53 private hosted zone that only answers
# inside the VPC, so a workstation needs those names pointed at the bastion's
# elastic IP by hand. Using the IP directly is not an option: the API server's
# certificate is issued for the name.
- name: Fetch kubeconfigs
  hosts: bastion
  gather_facts: false

  tasks:
    - name: Create the local destination
      ansible.builtin.file:
        path: "{{ repo_root }}/deploy/clusters/{{ cluster_name }}"
        state: directory
        mode: '0700'
      delegate_to: localhost

    - name: Fetch the base cluster kubeconfig
      ansible.builtin.fetch:
        src: "{{ kubeconfig }}"
        dest: "{{ repo_root }}/deploy/clusters/{{ cluster_name }}/kubeconfig"
        flat: true

    - name: Fetch the kubeadmin password
      ansible.builtin.fetch:
        src: "{{ install_dir }}/auth/kubeadmin-password"
        dest: "{{ repo_root }}/deploy/clusters/{{ cluster_name }}/kubeadmin-password"
        flat: true
      failed_when: false

    - name: Find the guest kubeconfigs
      ansible.builtin.find:
        paths: "{{ install_root }}/guests"
        patterns: "*.kubeconfig"
      register: guest_kubeconfigs
      failed_when: false

    - name: Fetch the guest kubeconfigs
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ repo_root }}/deploy/clusters/{{ cluster_name }}/{{ item.path | basename }}"
        flat: true
      loop: "{{ guest_kubeconfigs.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Show how to use them
      ansible.builtin.debug:
        msg:
          - "Kubeconfigs are in deploy/clusters/{{ cluster_name }}/"
          - ""
          - "Add these to /etc/hosts on your workstation:"
          - "  {{ bastion_public_ip }} api.{{ cluster_domain }}"
          - "  {{ bastion_public_ip }} console-openshift-console.apps.{{ cluster_domain }}"
          - "  {{ bastion_public_ip }} oauth-openshift.apps.{{ cluster_domain }}"
          - ""
          - "Then: export KUBECONFIG=deploy/clusters/{{ cluster_name }}/kubeconfig"
          - ""
          - "The guest clusters publish their API through the hub's ingress, so"
          - "each guest also needs its own api.* entry pointing at the same"
          - "address. 'oc get routes -A | grep kube-apiserver' on the hub lists them."
