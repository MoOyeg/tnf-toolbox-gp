---
# Copy the base cluster and guest kubeconfigs back to the workstation.
#
# The names resolve publicly: the cluster's records live in the account's public
# Route53 zone and point at the bastion's elastic IP, so the kubeconfig works as
# fetched -- no /etc/hosts, and no --insecure-skip-tls-verify, because the
# installer issued the certificate for that exact name.
#
# Cluster nodes still resolve the same names to the bastion's private address,
# via the more specific VPC-associated private zone.
#
# Both sites, each from its own bastion. A site that has not been built yet has
# no kubeconfig, and is skipped rather than failed -- 'make kubeconfig' runs
# right after 'make tnf' in the pipeline, long before the ACM cluster exists.
- name: Fetch kubeconfigs
  hosts: bastion:acm_bastion
  gather_facts: false
  vars:
    is_acm: "{{ inventory_hostname in groups['acm_bastion'] | default([]) }}"
    site_name: "{{ acm_cluster_name if is_acm | bool else cluster_name }}"
    site_install_dir: "{{ acm_install_dir if is_acm | bool else install_dir }}"
    site_kubeconfig: "{{ acm_kubeconfig if is_acm | bool else kubeconfig }}"
    site_domain: >-
      {{ (acm_cluster_name ~ '.' ~ base_domain) if is_acm | bool else cluster_domain }}

  tasks:
    - name: Look for this site's kubeconfig
      ansible.builtin.stat:
        path: "{{ site_kubeconfig }}"
      register: site_kubeconfig_stat

    # The file proves nothing on its own: 'openshift-install create
    # ignition-configs' writes auth/kubeconfig, so an attempt that never
    # produced a cluster leaves one behind. Fetching that hands out a
    # credential for something that does not exist. Ask the cluster.
    - name: Ask this site's cluster whether it is really installed
      ansible.builtin.command: >-
        oc --request-timeout=15s get clusterversion version
        -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
      environment:
        KUBECONFIG: "{{ site_kubeconfig }}"
        PATH: "{{ bin_dir }}:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
      register: site_clusterversion
      changed_when: false
      failed_when: false
      when: site_kubeconfig_stat.stat.exists

    - name: Record whether this site is built
      ansible.builtin.set_fact:
        site_built: >-
          {{ site_kubeconfig_stat.stat.exists
             and site_clusterversion.rc | default(1) == 0
             and site_clusterversion.stdout | default('') == 'True' }}

    - name: Report a site that is not built yet
      ansible.builtin.debug:
        msg: "{{ site_name }} is not installed yet; skipping it."
      when: not site_built | bool

    - name: Create the local destination
      ansible.builtin.file:
        path: "{{ repo_root }}/deploy/clusters/{{ site_name }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      when: site_built | bool

    - name: Fetch the cluster kubeconfig
      ansible.builtin.fetch:
        src: "{{ site_kubeconfig }}"
        dest: "{{ repo_root }}/deploy/clusters/{{ site_name }}/kubeconfig"
        flat: true
      when: site_built | bool

    - name: Fetch the kubeadmin password
      ansible.builtin.fetch:
        src: "{{ site_install_dir }}/auth/kubeadmin-password"
        dest: "{{ repo_root }}/deploy/clusters/{{ site_name }}/kubeadmin-password"
        flat: true
      failed_when: false
      when: site_built | bool

    - name: Find the guest kubeconfigs
      ansible.builtin.find:
        paths: "{{ install_root }}/guests"
        patterns: "*.kubeconfig"
      register: guest_kubeconfigs
      failed_when: false
      when: site_built | bool

    - name: Fetch the guest kubeconfigs
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ repo_root }}/deploy/clusters/{{ site_name }}/{{ item.path | basename }}"
        flat: true
      loop: "{{ guest_kubeconfigs.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # Proves the public record resolves and the API answers, from here rather
    # than from the bastion -- which is the whole claim being made.
    - name: Confirm the API is reachable from this workstation
      ansible.builtin.uri:
        url: "https://api.{{ site_domain }}:6443/version"
        validate_certs: false
        status_code: [200, 401, 403]
      delegate_to: localhost
      register: api_reachable
      retries: 10
      delay: 15
      until: api_reachable is not failed
      when: site_built | bool

    - name: Show how to use them
      when: site_built | bool
      ansible.builtin.debug:
        msg:
          - "Kubeconfigs are in deploy/clusters/{{ site_name }}/"
          - ""
          - "  export KUBECONFIG=deploy/clusters/{{ site_name }}/kubeconfig"
          - "  oc get nodes"
          - ""
          - "API:     https://api.{{ site_domain }}:6443  (reachable from here)"
          - "Console: https://console-openshift-console.apps.{{ site_domain }}"
          - "Login:   kubeadmin / (see deploy/clusters/{{ site_name }}/kubeadmin-password)"
          - ""
          - "The console certificate is the cluster's own self-signed ingress cert,"
          - "so a browser will warn. The API certificate is issued for this name and"
          - "validates, which is why oc needs no extra flags."
