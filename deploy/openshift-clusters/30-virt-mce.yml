---
# Stage 3: storage, OpenShift Virtualization and MultiCluster Engine -- what TNF
# needs in place before any guest cluster can be created on it.
#
# MCE, not ACM. TNF is the site that hosts the control planes and owns the GPUs;
# the management hub lives at the ACM site, outside TNF's failure domain. MCE is
# the half that carries the HyperShift operator, which is the half TNF needs.
- name: Prepare TNF to host virtualized control planes
  hosts: bastion
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    # The fallback must list the system sbin directories. A play's
    # environment: applies to the implicit fact gathering too, so on that first
    # task ansible_env is still undefined and the default is what PATH becomes
    # -- and the setup module then reports *that* as ansible_env.PATH for every
    # task after it. A short fallback silently loses /usr/sbin for the whole
    # play, and tools like haproxy stop being found.
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"

  tasks:
    # Storage first: both OpenShift Virtualization and every hosted control
    # plane's etcd need a default storage class to bind against.
    - name: Install LVM Storage on the EBS data volumes
      ansible.builtin.include_role:
        name: lvm-storage
      vars:
        op_kubeconfig: "{{ kubeconfig }}"

    # HyperConverged's permittedHostDevices must name the resource the GPU
    # Operator actually advertises, so it is read from the cluster rather than
    # taken from a constant.
    - name: Discover the passthrough GPU resource name
      ansible.builtin.include_role:
        name: common
        tasks_from: discover-gpu-resource
      vars:
        op_kubeconfig: "{{ kubeconfig }}"

    - name: Install OpenShift Virtualization
      ansible.builtin.include_role:
        name: cnv
      vars:
        op_kubeconfig: "{{ kubeconfig }}"

    - name: Install MultiCluster Engine
      ansible.builtin.include_role:
        name: acm
        tasks_from: mce-only
      vars:
        op_kubeconfig: "{{ kubeconfig }}"
