---
# Stage 3c: the ACM cluster, at its own site.
#
# ACM does not run on the cluster it manages. It has its own VPC, its own bastion
# and its own bare-metal node, joined to the TNF site by VPC peering. TNF keeps
# MultiCluster Engine and stays the infra cluster where guest VMs and GPUs live;
# ACM reaches it across the peering connection.
- name: Install the ACM cluster at the ACM site
  hosts: acm_bastion
  gather_facts: true
  environment:
    KUBECONFIG: "{{ acm_kubeconfig }}"
    # The fallback must list the system sbin directories. A play's
    # environment: applies to the implicit fact gathering too, so on that first
    # task ansible_env is still undefined and the default is what PATH becomes
    # -- and the setup module then reports *that* as ansible_env.PATH for every
    # task after it. A short fallback silently loses /usr/sbin for the whole
    # play, and tools like haproxy stop being found.
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"

  tasks:
    - name: Install the OpenShift clients on the ACM bastion
      ansible.builtin.include_role:
        name: common
        tasks_from: install-clients

    # Creates /srv/ignition and the base haproxy, exactly as 10-tnf-install.yml
    # does before tnf-install. sno-cluster's render step publishes ignition into
    # that directory, so it has to exist first; the role is re-included later
    # with include_bootstrap set, to add and then drop the bootstrap backend.
    - name: Configure haproxy and the ignition server on the ACM bastion
      ansible.builtin.include_role:
        name: loadbalancer
      vars:
        control_plane_nodes: "{{ acm_control_plane_nodes }}"

    - name: Install the single-node ACM cluster
      ansible.builtin.include_role:
        name: sno-cluster

    # Before ACM, which wants PVCs: the MultiClusterHub's search component, and
    # observability, whose Thanos compactor and receivers are provisioned from
    # obs_storage_class. Without a default storage class here the hub never
    # reaches Running. Still needed even though the hosted control planes and
    # their etcd have moved to TNF -- the hub's own components are enough to
    # require it.
    - name: Install LVM Storage on the ACM node's data volume
      ansible.builtin.include_role:
        name: lvm-storage
      vars:
        op_kubeconfig: "{{ acm_kubeconfig }}"
        control_plane_nodes: "{{ acm_control_plane_nodes }}"

    # Deliberately no OpenShift Virtualization here. It was installed on this
    # hub to run guest worker VMs; those, and the hosted control planes that
    # own them, are now created by TNF's own MultiCluster Engine and run on
    # TNF, which is where the GPUs are. The hub manages the fleet and runs no
    # virtual machines, which is also what lets its node be an ordinary EC2
    # instance rather than bare metal.
    #
    # If virtualization is ever wanted here again, ACM_SNO_INSTANCE_TYPE has to
    # go back to a .metal shape in the same change: KVM needs the hardware
    # extensions, and a nested hypervisor is not available on EC2.
    - name: Install ACM
      ansible.builtin.include_role:
        name: acm
      vars:
        op_kubeconfig: "{{ acm_kubeconfig }}"

    # The fleet view lists VirtualMachines that managed clusters report through
    # Search, so it works without OpenShift Virtualization on the hub -- what
    # the hub loses by not having it is the Virtualization section in its own
    # console, which described nothing, because the hub runs no VMs. Search is
    # made explicit rather than left to a default.
    - name: Make sure the fleet virtualization view will work
      ansible.builtin.include_role:
        name: acm
        tasks_from: virtualization
      vars:
        op_kubeconfig: "{{ acm_kubeconfig }}"

    # After ACM itself, because MultiClusterObservability is an ACM capability
    # and its CRD does not exist until the hub is up. Before the import below,
    # so that when TNF joins the fleet the observability addon is already
    # waiting for it rather than being pushed out afterwards.
    - name: Install MultiCluster Observability, right-sizing and the Perses UI
      ansible.builtin.include_role:
        name: observability
      vars:
        op_kubeconfig: "{{ acm_kubeconfig }}"

    - name: Give ACM a credential for the TNF infra cluster across the peering
      ansible.builtin.include_role:
        name: sno-cluster
        tasks_from: infra-credentials
      vars:
        op_kubeconfig: "{{ acm_kubeconfig }}"

    # Last, because it needs the credential the previous step wrote. ACM
    # auto-imports what it creates; TNF already existed, so the hub would
    # otherwise manage the guest clusters without seeing the cluster their VMs
    # and GPUs actually run on.
    - name: Import the TNF cluster into the hub
      ansible.builtin.include_role:
        name: acm
        tasks_from: import-cluster
      vars:
        op_kubeconfig: "{{ acm_kubeconfig }}"
        import_cluster_name: "{{ cluster_name }}"
        import_cluster_kubeconfig: "{{ acm_install_dir }}/infra-kubeconfig"
