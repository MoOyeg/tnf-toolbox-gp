---
# Stage 4d: write the fleet's site definitions.
#
# One folder per cluster: a namespace and a ClusterInstance, which is the whole
# description of a cluster -- name, domain, networks, and which install template
# builds it. Ansible writes them and stops. What the hub actually reconciles
# against is Git, so the last step is yours: commit and push.
#
# Secrets do not go to Git. Each site's pull secret, and for a hosted cluster the
# infra-cluster kubeconfig and its etcd encryption key, are put straight on the
# hub by these roles. A Secret in a repository is readable by everyone who can
# read the repository.
- name: Write the fleet's site definitions
  hosts: acm_bastion
  gather_facts: true
  environment:
    KUBECONFIG: "{{ acm_kubeconfig }}"
    # The fallback must list the system sbin directories. A play's
    # environment: applies to the implicit fact gathering too, so on that first
    # task ansible_env is still undefined and the default is what PATH becomes
    # -- and the setup module then reports *that* as ansible_env.PATH for every
    # task after it. A short fallback silently loses /usr/sbin for the whole
    # play, and tools like haproxy stop being found.
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"

  tasks:
    - name: Confirm the ClusterInstance CRD exists
      ansible.builtin.command: >-
        oc get crd clusterinstances.siteconfig.open-cluster-management.io
        -o jsonpath={.metadata.name}
      register: ci_crd
      changed_when: false
      failed_when: false

    - name: Fail if SiteConfig has not been enabled
      ansible.builtin.assert:
        that: ci_crd.rc == 0
        fail_msg: >-
          The ClusterInstance CRD is missing. Run 'make siteconfig' first: it
          enables the operator and creates the install templates these site
          definitions reference.

    - name: Write the guest clusters' site definitions
      ansible.builtin.include_role:
        name: hcp-guest
        tasks_from: siteconfig-sites
      vars:
        op_kubeconfig: "{{ acm_kubeconfig }}"
        guest_infra_kubeconfig: "{{ acm_install_dir }}/infra-kubeconfig"

    - name: Write the all-VM cluster's site definition
      ansible.builtin.include_role:
        name: vcp-cluster
        tasks_from: siteconfig-site
      vars:
        op_kubeconfig: "{{ acm_kubeconfig }}"
        vcp_infra_kubeconfig: "{{ acm_install_dir }}/infra-kubeconfig"

    # The seam between "SiteConfig built a cluster" and everything downstream.
    #
    # The stages that create guests directly extract each cluster's kubeconfig
    # as their last step, and 50-guest-gpu.yml and 60-app.yml find their work by
    # globbing this directory. A cluster built from Git is never touched by
    # those stages, so without this it exists and is reachable and no later
    # stage can see it.
    #
    # Harvested for whatever is ready and quiet about the rest: a site committed
    # a minute ago has no admin kubeconfig yet, and re-running this stage once it
    # does is the way to pick it up.
    - name: Make somewhere for the guest kubeconfigs
      ansible.builtin.file:
        path: "{{ guest_kubeconfig_dir }}"
        state: directory
        mode: '0700'

    - name: List the clusters built from site definitions
      ansible.builtin.command: >-
        oc get clusterinstance -A
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
      register: site_clusters
      changed_when: false

    # Two places, because the two profiles do not agree. Hive writes
    # <cluster>-admin-kubeconfig into the cluster's own namespace; HyperShift
    # writes plain admin-kubeconfig into the hosted control plane's namespace,
    # which is <hcp_namespace>-<cluster>. Looking in only the first found
    # nothing for a hosted guest.
    #
    # Written through a temp file and moved into place, and that is the whole
    # point rather than tidiness: a redirect truncates its target before the
    # command runs, so a lookup that failed left an empty file behind -- and the
    # task that swept those up then deleted a working kubeconfig that another
    # stage had written. 'make sites' is meant to be re-runnable, and it was
    # quietly destroying what it could not find. Nothing is touched now unless
    # there is content to put there.
    - name: Harvest the kubeconfig of every site that has one
      ansible.builtin.shell: |
        set -o pipefail
        tmp="$(mktemp)"
        trap 'rm -f "${tmp}"' EXIT
        for pair in "{{ item }}:{{ item }}-admin-kubeconfig" \
                    "{{ hcp_namespace }}-{{ item }}:admin-kubeconfig"; do
          ns="${pair%%:*}"; secret="${pair##*:}"
          if oc get secret "${secret}" -n "${ns}" \
               -o jsonpath='{.data.kubeconfig}' 2>/dev/null \
               | base64 -d > "${tmp}" && [ -s "${tmp}" ]; then
            install -m 0600 "${tmp}" "{{ guest_kubeconfig_dir }}/{{ item }}.kubeconfig"
            echo "${ns}/${secret}"
            exit 0
          fi
        done
        exit 1
      loop: "{{ site_clusters.stdout_lines | select | list }}"
      register: harvested
      changed_when: harvested.rc == 0
      failed_when: false

    # The last link. A cluster built from a site definition is accepted by the
    # hub and then waits to be told about itself; this applies the import
    # manifests the hub generated, which is what starts its klusterlet.
    # Only for guests whose kubeconfig was harvested above -- the rest are not
    # installed yet and there is nothing to import.
    - name: Finish importing each guest into the hub
      ansible.builtin.include_role:
        name: acm
        tasks_from: complete-import
      vars:
        op_kubeconfig: "{{ acm_kubeconfig }}"
        import_cluster_name: "{{ item.item }}"
        import_cluster_kubeconfig: "{{ guest_kubeconfig_dir }}/{{ item.item }}.kubeconfig"
      loop: "{{ harvested.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      # Not one whose API the check in vcp-cluster/tasks/expose.yml found
      # unreachable from here: that run has already said what unblocks it, and
      # the import would only fail the stage on the same missing route.
      when:
        - item.rc | default(1) == 0
        - item.item not in (vcp_guests_unreachable | default([]))

    # The guests built from sites-infra/ rather than from a ClusterInstance.
    # 'oc get clusterinstance' above cannot see them -- their HostedCluster and
    # NodePool are applied to the infra cluster by Argo CD, and nothing on the
    # hub represents them until they are imported. Which is what this does:
    # reads each one's admin kubeconfig off the cluster hosting it, stages it
    # where the later stages glob, and registers it with the hub.
    #
    # Skipped quietly for a guest Argo CD has not finished building: that is a
    # normal state a minute after committing, and re-running picks it up.
    - name: Import the hosted guests into the hub
      ansible.builtin.include_tasks: tasks/import-guest.yml
      vars:
        # Start the import and move on. This stage still has the all-VM
        # cluster's agents to approve and its DNS records to publish, and a
        # guest that is still installing must not stand between them.
        import_wait_online: false
      loop: "{{ range(1, (guest_cluster_count | int) + 1) | list }}"
      loop_control:
        loop_var: guest_index
        label: "{{ guest_cluster_prefix }}-{{ guest_index }}"

    # find, not ls. A glob that matches nothing makes ls exit 2, and
    # 2>/dev/null hides the message but not the status -- with pipefail set the
    # pipeline then fails even though wc counted correctly. That is exactly the
    # fresh-fleet case this report exists to describe: no guest built yet, zero
    # kubeconfigs, and the stage would die one task before saying so.
    - name: Report which guests are reachable
      ansible.builtin.shell: >-
        set -o pipefail;
        find {{ guest_kubeconfig_dir }} -maxdepth 1 -name '*.kubeconfig' | wc -l
      register: guest_count
      changed_when: false

    - name: Say what happens next
      ansible.builtin.debug:
        msg:
          - "Site definitions are written under {{ site_repo_dir }}/."
          - "git add, commit and push them: Argo CD builds the fleet from Git,"
          - "not from this run. 'oc get clusterinstance -A' on the hub follows it."
          - "{{ guest_count.stdout | trim }} guest kubeconfig(s) harvested into {{ guest_kubeconfig_dir }}."
          - "Re-run this stage once more clusters finish installing to pick them up."
