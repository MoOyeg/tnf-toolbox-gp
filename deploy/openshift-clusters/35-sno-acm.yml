---
# Stage 3b: a single-node OpenShift cluster on TNF, running ACM.
#
# This is the separation the refactor is for. ACM used to run on the same cluster
# that hosted the guest clusters, which meant the management plane died with the
# thing it managed. It now runs on its own SNO, itself a VM on TNF.
#
# TNF keeps MultiCluster Engine and stays the infra cluster: the guest VMs and
# the GPUs are there, and the SNO reaches back into it through
# --infra-kubeconfig-file when it creates virtualized clusters.
- name: Install the ACM hub on its own single-node cluster
  hosts: bastion
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"

  tasks:
    # Nothing here is safe on a cluster that cannot survive losing a node: the
    # SNO is a workload on TNF, and its storage is TNF's.
    - name: Require a healthy TNF cluster before building on it
      ansible.builtin.include_role:
        name: tnf-install
        tasks_from: health
      vars:
        op_kubeconfig: "{{ kubeconfig }}"

    # DNS and haproxy first: the installer is polled through them, so they have
    # to be routing before the VM finishes installing.
    - name: Publish DNS records for the SNO
      ansible.builtin.include_role:
        name: sno-dns

    - name: Teach haproxy to route the SNO by SNI
      ansible.builtin.include_role:
        name: loadbalancer
      vars:
        sno_enabled: true

    - name: Install the SNO cluster
      ansible.builtin.include_role:
        name: sno-cluster
      vars:
        op_kubeconfig: "{{ kubeconfig }}"

    # The same role that used to run against TNF, pointed at the SNO instead.
    # That it needed no changes is the payoff for having parameterised every
    # cluster-facing role on op_kubeconfig from the start.
    - name: Install ACM on the SNO
      ansible.builtin.include_role:
        name: acm
      vars:
        op_kubeconfig: "{{ sno_install_dir }}/auth/kubeconfig"

    - name: Give the SNO a kubeconfig for the TNF infra cluster
      ansible.builtin.include_role:
        name: sno-cluster
        tasks_from: infra-credentials
      vars:
        op_kubeconfig: "{{ sno_install_dir }}/auth/kubeconfig"
