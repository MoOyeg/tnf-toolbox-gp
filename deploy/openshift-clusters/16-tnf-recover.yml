---
# Manual recovery for a TNF cluster that has not come back on its own.
#
# Follows the OpenShift documentation's procedure -- Installing a two-node
# OpenShift cluster / Two-node with Fencing / Post-installation troubleshooting
# and recovery / "Manually recovering from a disruption event when automated
# recovery is unavailable" -- attempting each step in the order given, least
# invasive first, and re-checking the cluster after every one. The first step
# that makes it healthy is the last that runs.
#
# Nothing here is part of 'make all'. It is for the case where a stage has
# stopped because the cluster is not healthy and the automatic recovery that
# should have handled it did not.
- name: Recover a two-node fencing cluster
  hosts: bastion
  gather_facts: true
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    # The fallback must list the system sbin directories. A play's
    # environment: applies to the implicit fact gathering too, so on that first
    # task ansible_env is still undefined and the default is what PATH becomes
    # -- and the setup module then reports *that* as ansible_env.PATH for every
    # task after it. A short fallback silently loses /usr/sbin for the whole
    # play, and tools like haproxy stop being found.
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"

  tasks:
    - name: Work through the documented recovery steps
      ansible.builtin.include_role:
        name: tnf-recover
      vars:
        op_kubeconfig: "{{ kubeconfig }}"
