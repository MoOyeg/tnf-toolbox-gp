---
# Defaults and derived values. Anything a user is meant to change lives in
# config/instance.env and arrives as an extra var via scripts/run-playbook.sh,
# which always wins over what is set here.

# ------------------------------------------------------------------ paths
# Everything the installer produces stays on the bastion. It is the only host
# that can resolve api-int, so it is the only host that can drive an install.
install_root: "/home/{{ ansible_user }}/clusters"
install_dir: "{{ install_root }}/{{ cluster_name }}"
kubeconfig: "{{ install_dir }}/auth/kubeconfig"
bin_dir: "/usr/local/bin"

# Where each bastion serves ignition from. The masters keep pointing here after
# install, so rebuilding a node does not need the config regenerated. Global
# rather than a role default because three roles reach for it -- tnf-install and
# sno-cluster write the configs, loadbalancer serves them -- and a role's
# defaults are invisible to every other role.
ignition_root: /srv/ignition
ignition_port: 8080

# ------------------------------------------------------------------ release
ocp_version: "4.22.0"
ocp_mirror: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp"
# The release every guest cluster is built from, hosted or standalone. Read by
# hcp-guest and vcp-cluster both, so it cannot live in either.
guest_release_image: "quay.io/openshift-release-dev/ocp-release:{{ ocp_version }}-x86_64"
# Where their kubeconfigs are collected on whichever bastion created them.
guest_kubeconfig_dir: "{{ install_root }}/guests"
# Empty for 4.22, where two-node fencing is GA. Setting TechPreviewNoUpgrade
# there also enables ClusterAPIMachineManagement, which breaks the HyperShift
# operator install on platform:none -- see config/instance.env.template.
feature_set: ""

# ------------------------------------------------------------------ topology
control_plane_nodes:
  - name: master-0
    private_ip: "{{ master0_private_ip }}"
    gpu_workload: "{{ master0_gpu_workload }}"
    data_volume: "{{ master0_data_volume | default('') }}"
  - name: master-1
    private_ip: "{{ master1_private_ip }}"
    gpu_workload: "{{ master1_gpu_workload }}"
    data_volume: "{{ master1_data_volume | default('') }}"

# The hostname each node reports must equal the name in
# controlPlane.fencing.credentials, or the TNF controller builds a stonith
# device targeting a node Pacemaker has never heard of. Ignition sets
# /etc/hostname to these values.
# The ACM site's node list, in the same shape as control_plane_nodes so the
# loadbalancer role can front either site without knowing which it is looking at.
# The ACM cluster's artifacts on the ACM bastion. These are referenced by the
# play's environment: block, which is evaluated before any role's defaults are
# loaded -- so they cannot live in the sno-cluster role.
acm_install_root: "/home/{{ ansible_user }}/clusters"
acm_install_dir: "{{ acm_install_root }}/{{ acm_cluster_name | default('acm') }}"
acm_kubeconfig: "{{ acm_install_dir }}/auth/kubeconfig"
acm_sno_node_name: sno-0

# The namespace on TNF that VMs created by the ACM hub land in. Deliberately not
# 'clusters', which TNF's own MCE uses for guests it hosts itself -- two
# HyperShift operators reconciling one namespace would each believe they owned
# it. Read by sno-cluster (which creates it) and hcp-guest (which targets it).
acm_infra_namespace: acm-hosted-vms

# The namespace HostedClusters are created in, on whichever cluster is hosting
# them. Read by hcp-guest, sno-cluster and clean-guests.yml.
hcp_namespace: clusters

acm_control_plane_nodes:
  - name: "{{ acm_sno_node_name | default('sno-0') }}"
    private_ip: "{{ acm_sno_private_ip | default('10.1.0.10') }}"
    gpu_workload: container
    # The fact wins when this run relaunched the node, because the extra var
    # was read from state before the stack was replaced. Falling back to the
    # extra var covers the already-installed case, where launch.yml is skipped.
    data_volume: >-
      {{ acm_sno_data_volume_actual | default(acm_sno_data_volume | default('')) }}

network_type: OVNKubernetes
cluster_network_cidr: 10.128.0.0/14
cluster_network_host_prefix: 23
service_network_cidr: 172.30.0.0/16

# ------------------------------------------------------------------ fencing
# Bare metal EC2 instances take minutes to stop, where a real BMC cuts power in
# seconds. Pacemaker's defaults assume the latter, so they are raised after
# install. See docs/fencing-on-aws.md.
stonith_timeout: 600s
stonith_power_timeout: 600
stonith_reboot_timeout: 900

# ------------------------------------------------------------------ operators
# Channels are auto-detected from the package manifest when left as 'auto', so
# the toolbox does not go stale every time a channel is renamed.
nfd_channel: auto
gpu_operator_channel: auto
lvms_channel: auto
cnv_channel: auto
acm_channel: auto
mce_channel: auto

nfd_namespace: openshift-nfd
gpu_operator_namespace: nvidia-gpu-operator
lvms_namespace: openshift-storage
cnv_namespace: openshift-cnv
acm_namespace: open-cluster-management

# ------------------------------------------------------------------ GPU
# g4dn.metal carries eight Tesla T4s. 10DE:1EB8 is the PCI id KubeVirt matches
# on; nvidia.com/TU104GL_Tesla_T4 is the resource name the GPU Operator's
# sandbox device plugin advertises for them.
gpu_pci_vendor_device: "10DE:1EB8"
gpu_resource_name: "nvidia.com/TU104GL_TESLA_T4"
gpu_device_label: "nvidia.com/gpu.workload.config"
# Named here rather than in the role, because 20-base-gpu.yml asserts it exists
# and must agree with the stage that creates it.
iommu_machine_config_name: 100-master-gpu-passthrough
storage_class: "lvms-vg1"

# ------------------------------------------------------------------ timeouts
# Generous, because these run against two-node clusters where a rollout that
# needs a reboot has to drain half the cluster to do it.
operator_csv_timeout: 900
mcp_rollout_timeout: 3600
bootstrap_timeout: 3600
install_timeout: 5400
hosted_cluster_timeout: 3600
# How long to wait for the cluster to become healthy as TNF. Generous: after a
# node reboot, Pacemaker and etcd take several minutes to re-form the pair.
tnf_health_timeout: 1800
