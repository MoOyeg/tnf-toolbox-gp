---
# Write this instance's manifests into the fleet repository.
#
# Not applied. The cluster's own Argo CD applies them, having been handed the
# Application by ACM's pull model -- so this stage's job is to render what
# should be running and commit is what makes it so, the same contract
# 'make sites' has for site definitions.
#
# Rendering runs the application's own `make render` rather than reimplementing
# its substitutions here, for the reason the deploy path had: the app repository
# owns how a manifest becomes a deployable manifest, and two copies of that
# would drift silently because nothing compares them. render and deploy share
# the substitutions, so a component added to one is added to both.
#
# On localhost, not the bastion. The fleet repository is on the control host and
# so is the application source; the bastion's staged copy exists for the image
# build, which needs a cluster to build in.

- name: "{{ app_label }}/{{ app_namespace }}: work out which cluster this is"
  ansible.builtin.set_fact:
    app_cluster: "{{ app_label | regex_replace('\\.kubeconfig$', '') }}"

- name: "{{ app_label }}/{{ app_namespace }}: render the manifests into the fleet repository"
  ansible.builtin.command:
    cmd: >-
      make -C {{ repo_root }}/app render
      OUT={{ gitops_fleet_repo_dir }}/{{ app_cluster }}/{{ app_namespace }}
      NAMESPACE={{ app_namespace }}
      REGISTRY={{ app_registry }}
      CAMERAS={{ app_cameras }}
      MODEL={{ app_model }}
      VLLM_IMAGE={{ app_vllm_image }}
  delegate_to: localhost
  register: app_render
  changed_when: true

- name: "{{ app_label }}/{{ app_namespace }}: say what happens next"
  ansible.builtin.debug:
    msg:
      - "{{ app_cluster }}: {{ app_namespace }} written to
         {{ gitops_fleet_repo_dir }}/{{ app_cluster }}/{{ app_namespace }}/"
      - "Commit and push it. The cluster's own Argo CD applies it -- this run does not."
      - "The images are built already; a Deployment whose image is still building
         simply stays unhealthy until it lands."
