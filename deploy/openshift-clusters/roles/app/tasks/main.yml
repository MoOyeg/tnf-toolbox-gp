---
# Deploy the visual inspection app into one guest cluster.
#
# op_kubeconfig names the guest; the play loops this role over every guest
# kubeconfig it finds. Everything here is re-runnable: the namespace and the
# credentials are declarative, the builds are created once and started on every
# run, and the manifests are applied by the app's own Makefile.

- name: "{{ app_label }}: confirm the guest advertises a GPU"
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get nodes -o json
    | jq '[.items[].status.allocatable["nvidia.com/gpu"] // "0" | tonumber] | add'
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: app_gpu_total
  changed_when: false

# The analyzer takes one GPU for the fast path and vLLM takes another for the
# slow one. Said rather than enforced, because nothing this role does needs a
# GPU: it builds images in the cluster and renders manifests into the fleet
# repository, and it is the guest's own Argo CD that later creates the pods
# which do. A shortfall here is a statement about the future, so failing on it
# only forces this stage to be run twice.
#
# It used to fail, and the reason is kept because the diagnosis is the valuable
# part: pods that cannot be scheduled report insufficient nvidia.com/gpu, which
# reads as a capacity problem rather than as "the GPU stage has not finished in
# this guest yet". Saying so here, while the build runs, means the message
# arrives before the symptom instead of after it -- and the build, which is the
# long pole at roughly twenty minutes, overlaps the GPU Operator's rollout
# rather than queueing behind it.
- name: "{{ app_label }}: say whether the GPUs the pods will need are there yet"
  ansible.builtin.debug:
    msg: >-
      {{ app_label }} advertises {{ app_gpu_total.stdout }} nvidia.com/gpu and
      {{ app_instances }} instance(s) will need {{ 2 * app_instances | int }} --
      one for the analyzer's fast path and one for vLLM, each.
      {{ 'Enough; the pods will schedule as soon as they are created.'
         if (app_gpu_total.stdout | int >= (2 * app_instances | int))
         else "Not enough yet, which is fine while 'make guest-gpu' is still
               running: the images build and the manifests render regardless,
               and the pods stay Pending until the GPU Operator advertises the
               passed-through T4s. If that stage has already finished, lower
               app_instances or give the guest's workers more GPUs." }}

# Each instance is complete and independent, so they are deployed one after
# another rather than all at once: a failure then names the instance that broke.
- name: "{{ app_label }}: deploy {{ app_instances }} instance(s) of the application"
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ range(1, app_instances | int + 1) | list }}"
  loop_control:
    loop_var: app_instance
    label: "{{ app_namespace_base }}-{{ app_instance }}"
