---
- name: Set the name for this guest cluster
  ansible.builtin.set_fact:
    guest_name: "{{ guest_cluster_prefix }}-{{ guest_index }}"

# Rendering is not repeatable: hcp mints a fresh random infraID on every
# invocation, and both infraID and dns.baseDomain are immutable once the
# HostedCluster exists. Applying a re-render therefore fails --
#
#   The HostedCluster "vcp-1" is invalid:
#     spec.dns.baseDomain: Invalid value: "": baseDomain is immutable
#     spec.infraID: Invalid value: "vcp-1-2brzc": infraID is immutable
#
# -- which would make this stage unresumable after any interruption. So an
# existing guest cluster is left exactly as it is and the play falls through to
# the waits below, which are what a resumed run actually needs.
- name: "{{ guest_name }}: check whether it already exists"
  ansible.builtin.command: >-
    oc get hostedcluster {{ guest_name }} -n {{ hcp_namespace }} -o name
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: guest_exists
  changed_when: false
  failed_when: false

- name: "{{ guest_name }}: report that it is being left alone"
  ansible.builtin.debug:
    msg: >-
      {{ guest_name }} already exists; skipping render and apply, and waiting for
      it to finish coming up. Delete it with 'hcp destroy cluster kubevirt' to
      rebuild from scratch.
  when: guest_exists.rc == 0

# Rendering to a file first, rather than letting hcp create directly, keeps the
# exact manifests that produced a cluster on disk. When a NodePool sits Pending
# a week later, that file is the difference between reading what was asked for
# and guessing.
#
# --render-sensitive is required, not optional. Without it hcp omits every
# Secret while the HostedCluster still references them, so the cluster is
# created and then sits forever on
# "failed to get pull secret: Secret \"<name>-pull-secret\" not found" with no
# control-plane pods. It does mean the saved manifest contains the pull secret
# and the etcd encryption key, which is why it is written 0600.
- name: "{{ guest_name }}: render the manifests"
  ansible.builtin.command:
    cmd: >-
      {{ bin_dir }}/hcp create cluster kubevirt
      --name {{ guest_name }}
      --namespace {{ hcp_namespace }}
      --release-image {{ guest_release_image }}
      --pull-secret {{ guest_workdir }}/pull-secret.json
      --node-pool-replicas {{ guest_nodepool_replicas }}
      --control-plane-availability-policy {{ guest_control_plane_availability }}
      --infra-availability-policy {{ guest_infra_availability }}
      --cores {{ guest_vm_cores }}
      --memory {{ guest_vm_memory }}
      --root-volume-size {{ guest_vm_root_disk | regex_replace('Gi$', '') }}
      --root-volume-storage-class {{ storage_class }}
      --etcd-storage-class {{ storage_class }}
      --host-device-name "{{ gpu_resource_name }},count:{{ guest_gpus_per_node }}"
      {% if guest_infra_kubeconfig | default('') %}--infra-kubeconfig-file {{ guest_infra_kubeconfig }} --infra-namespace {{ acm_infra_namespace }}{% endif %}
      --render
      --render-sensitive
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: hcp_render
  changed_when: false
  when: guest_exists.rc != 0

- name: "{{ guest_name }}: save the manifests"
  ansible.builtin.copy:
    content: "{{ hcp_render.stdout }}"
    dest: "{{ guest_workdir }}/guest-manifests/{{ guest_name }}.yaml"
    mode: '0600'
  when: guest_exists.rc != 0

- name: "{{ guest_name }}: confirm the GPU request survived rendering"
  ansible.builtin.assert:
    that: gpu_resource_name in hcp_render.stdout
    fail_msg: >-
      The rendered manifests for {{ guest_name }} do not mention
      {{ gpu_resource_name }}. The cluster would come up without GPUs.
    success_msg: "{{ guest_name }} requests {{ guest_gpus_per_node }}x {{ gpu_resource_name }} per worker"
  when: guest_exists.rc != 0

# hcp names the NodePool itself. It happens to match the cluster name today,
# but the waits below should not depend on that -- reading it back from the
# manifest that was actually applied costs nothing and cannot drift.
# The pull secret is what the HostedCluster blocks on if --render-sensitive is
# ever dropped, so its absence is caught here rather than 40 minutes later.
# hcp publishes the guest's kube-apiserver as a Service of type LoadBalancer,
# and there is no flag to change it. On bare metal with no load-balancer
# controller that Service never gets an address, so the hosted control plane
# stops before it starts:
#
#   InfrastructureReady=False WaitingOnInfrastructureReady:
#     kube-apiserver load balancer is not provisioned
#   kube-apiserver  LoadBalancer  172.30.42.105  <pending>  6443:31923/TCP
#
# Route removes that one LoadBalancer but replaces it with another: HyperShift
# deploys a private router to serve Route-strategy services and exposes *it*
# with a LoadBalancer, which on platform:none stays <pending> just the same:
#
#   router  LoadBalancer  172.30.80.97  <pending>  443:32544/TCP
#   InfrastructureReady=False: router load balancer is not provisioned
#
# and the control-plane-operator reconciles that Service back to LoadBalancer
# if it is patched, so it cannot be worked around after the fact. Red Hat's
# guidance for hosted control planes on OpenShift Virtualization is to run
# MetalLB on the hosting cluster, which does not fit here: MetalLB's L2 mode
# announces by ARP, and AWS only delivers to addresses actually assigned to an
# ENI.
#
# NodePort needs no load balancer at all, and with no Route-strategy service
# left HyperShift never creates the private router. The address has to be a node
# of the *hosting* cluster that the guest's worker VMs can reach: they run on
# TNF and the control plane is on the ACM hub, so it is the hub's node address,
# across the VPC peering.
#
# spec.services cannot be changed after the HostedCluster exists, which is why
# this rewrites the manifest rather than patching the object.
- name: "{{ guest_name }}: publish the guest services on NodePorts, not LoadBalancers"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys, yaml
        path, address = sys.argv[1], sys.argv[2]
        docs = [d for d in yaml.safe_load_all(open(path)) if d]
        changed = False
        for doc in docs:
            if doc.get("kind") != "HostedCluster":
                continue
            for svc in doc.get("spec", {}).get("services", []):
                strategy = svc.setdefault("servicePublishingStrategy", {})
                node_port = strategy.get("nodePort") or {}
                if (strategy.get("type") != "NodePort"
                        or node_port.get("address") != address):
                    strategy["type"] = "NodePort"
                    strategy.pop("loadBalancer", None)
                    strategy.pop("route", None)
                    node_port["address"] = address
                    strategy["nodePort"] = node_port
                    changed = True
        if changed:
            with open(path, "w") as fh:
                yaml.safe_dump_all(docs, fh, default_flow_style=False)
        print("rewritten" if changed else "already NodePort")
      - "{{ guest_workdir }}/guest-manifests/{{ guest_name }}.yaml"
      - "{{ guest_api_address }}"
  register: apiserver_strategy
  changed_when: apiserver_strategy.stdout == "rewritten"
  when: guest_exists.rc != 0

# Every service, not just the API: one Route-strategy service left behind is
# enough to bring the private router and its LoadBalancer back.
- name: "{{ guest_name }}: confirm no service still wants a load balancer"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys, yaml
        for d in yaml.safe_load_all(open(sys.argv[1])):
            if not d or d.get("kind") != "HostedCluster":
                continue
            for s in d["spec"]["services"]:
                st = s["servicePublishingStrategy"]
                print(f'{s["service"]}={st["type"]}:'
                      f'{st.get("nodePort", {}).get("address", "NO-ADDRESS")}')
      - "{{ guest_workdir }}/guest-manifests/{{ guest_name }}.yaml"
  register: apiserver_publishing
  changed_when: false
  failed_when: >-
    apiserver_publishing.stdout_lines | reject('search', '=NodePort:' ~ guest_api_address)
    | list | length > 0
  when: guest_exists.rc != 0

- name: "{{ guest_name }}: confirm the rendered manifests carry their secrets"
  ansible.builtin.assert:
    that: "'kind: Secret' in hcp_render.stdout"
    fail_msg: >-
      The rendered manifests for {{ guest_name }} contain no Secret. hcp omits
      them unless --render-sensitive is passed, and the HostedCluster will sit
      on "failed to get pull secret" forever with no control-plane pods.
    success_msg: "{{ guest_name }} manifests include the referenced secrets"
  when: guest_exists.rc != 0

- name: "{{ guest_name }}: read the NodePool name out of the rendered manifest"
  ansible.builtin.shell: >-
    set -o pipefail;
    awk '/^kind: NodePool$/{f=1} f&&/^  name: /{print $2; exit}'
    {{ guest_workdir }}/guest-manifests/{{ guest_name }}.yaml
  register: rendered_nodepool
  changed_when: false
  when: guest_exists.rc != 0

# On a resumed run the render was skipped, so rendered_nodepool does not exist.
# hcp names the NodePool after the cluster, which is the right fallback.
- name: "{{ guest_name }}: use the rendered NodePool name"
  ansible.builtin.set_fact:
    guest_nodepool_name: >-
      {{ (rendered_nodepool.stdout | default('') | trim) or guest_name }}

- name: "{{ guest_name }}: apply the manifests"
  ansible.builtin.command: "oc apply -f {{ guest_workdir }}/guest-manifests/{{ guest_name }}.yaml"
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: guest_applied
  changed_when: "'created' in guest_applied.stdout or 'configured' in guest_applied.stdout"
  when: guest_exists.rc != 0

- name: "{{ guest_name }}: wait for the hosted control plane to become available"
  ansible.builtin.command: >-
    oc get hostedcluster {{ guest_name }} -n {{ hcp_namespace }}
    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: hc_available
  changed_when: false
  retries: "{{ (hosted_cluster_timeout | int / 30) | int }}"
  delay: 30
  until: hc_available.stdout == "True"

- name: "{{ guest_name }}: wait for the worker VMs to join"
  block:
    - name: "{{ guest_name }}: poll NodePool {{ guest_nodepool_name }}"
      ansible.builtin.command: >-
        oc get nodepool {{ guest_nodepool_name }} -n {{ hcp_namespace }}
        -o jsonpath={.status.replicas}
      environment:
        KUBECONFIG: "{{ op_kubeconfig }}"
      register: np_replicas
      changed_when: false
      retries: "{{ (nodepool_timeout | int / 30) | int }}"
      delay: 30
      until: np_replicas.stdout | default('0') | int >= (guest_nodepool_replicas | int)
  rescue:
    # A NodePool that never becomes ready is almost always a VM that cannot be
    # scheduled, and on this rig that is almost always the GPU request: only the
    # node labelled vm-passthrough advertises the resource, and it has a finite
    # number of them.
    - name: "{{ guest_name }}: collect NodePool diagnostics"
      ansible.builtin.shell: |
        echo "--- nodepools in {{ hcp_namespace }} ---"
        oc get nodepool -n {{ hcp_namespace }} 2>&1
        echo "--- nodepool {{ guest_nodepool_name }} ---"
        oc get nodepool {{ guest_nodepool_name }} -n {{ hcp_namespace }} -o yaml 2>&1 | tail -40
        echo "--- virtual machines ---"
        oc get vmi -n {{ hcp_namespace }}-{{ guest_name }} -o wide 2>&1
        echo "--- unschedulable pods ---"
        oc get pods -n {{ hcp_namespace }}-{{ guest_name }} --field-selector=status.phase=Pending -o wide 2>&1
        echo "--- gpu capacity ---"
        oc get nodes -o json 2>/dev/null | jq -r --arg r "{{ gpu_resource_name }}" \
          '.items[] | "\(.metadata.name) allocatable=\(.status.allocatable[$r] // "none")"'
      environment:
        KUBECONFIG: "{{ op_kubeconfig }}"
      register: np_diagnostics
      changed_when: false
      failed_when: false

    - name: "{{ guest_name }}: report and fail"
      ansible.builtin.fail:
        msg: |
          {{ guest_name }}'s NodePool did not reach {{ guest_nodepool_replicas }}
          replica(s) within {{ nodepool_timeout }}s.

          Each worker asks for {{ guest_gpus_per_node }}x {{ gpu_resource_name }}.
          Across {{ guest_cluster_count }} guest clusters that is
          {{ (guest_cluster_count | int) * (guest_nodepool_replicas | int) * (guest_gpus_per_node | int) }}
          GPUs, and only the node labelled vm-passthrough supplies them.
          {{ np_diagnostics.stdout }}

- name: "{{ guest_name }}: extract the kubeconfig"
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get secret {{ guest_name }}-admin-kubeconfig -n {{ hcp_namespace }}
    -o jsonpath={.data.kubeconfig} | base64 -d
    > {{ guest_kubeconfig_dir }}/{{ guest_name }}.kubeconfig
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: guest_kubeconfig_extract
  changed_when: true
  retries: 20
  delay: 15
  until: guest_kubeconfig_extract.rc == 0

- name: "{{ guest_name }}: protect the kubeconfig"
  ansible.builtin.file:
    path: "{{ guest_kubeconfig_dir }}/{{ guest_name }}.kubeconfig"
    mode: '0600'

- name: "{{ guest_name }}: wait for the worker nodes to be Ready"
  ansible.builtin.command: oc get nodes --no-headers
  environment:
    KUBECONFIG: "{{ guest_kubeconfig_dir }}/{{ guest_name }}.kubeconfig"
  register: guest_nodes
  changed_when: false
  retries: 60
  delay: 30
  until:
    - guest_nodes.rc == 0
    - guest_nodes.stdout_lines | select('search', ' Ready') | list | length >= (guest_nodepool_replicas | int)

# The point of the whole exercise: confirm a real T4 is visible inside the
# guest cluster's VM, as a PCI device the guest's own kernel can see.
- name: "{{ guest_name }}: confirm the GPU reached the guest's worker VM"
  ansible.builtin.shell: >-
    set -o pipefail;
    oc debug node/{{ guest_nodes.stdout_lines[0].split()[0] }} --quiet --
    chroot /host bash -c "lspci -d 10de: -nn"
  environment:
    KUBECONFIG: "{{ guest_kubeconfig_dir }}/{{ guest_name }}.kubeconfig"
  register: guest_lspci
  changed_when: false
  retries: 10
  delay: 20
  until: guest_lspci.rc == 0 and '10de' in guest_lspci.stdout

- name: "{{ guest_name }}: report"
  ansible.builtin.debug:
    msg:
      - "{{ guest_name }} is up with {{ np_replicas.stdout }} worker VM(s)."
      - "GPUs inside the VM: {{ guest_lspci.stdout_lines }}"
      - "kubeconfig: {{ guest_kubeconfig_dir }}/{{ guest_name }}.kubeconfig"
