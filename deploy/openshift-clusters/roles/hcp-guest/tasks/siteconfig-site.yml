---
# Write one guest's definition into the fleet repository, and put the secrets it
# references on the cluster that will host it.
#
# The definition goes under sites-infra/, not sites/. sites/ is the half of a
# site the hub applies to itself, and the SiteConfig operator expands a
# ClusterInstance into the cluster it runs in -- so a ClusterInstance for a
# hosted cluster always produces a control plane on the hub. That is structural.
# This guest's control plane runs on TNF, so its manifests are the half of the
# site placed on the infra cluster, which is what sites-infra/ already means and
# what applicationset-infra.yaml.j2 already delivers there.
#
# Two secrets rather than the three the hub-hosted profile needed: the pull
# secret and the key etcd is encrypted with. The third was a kubeconfig letting
# HyperShift reach across to another cluster to make VMs, and there is no across
# any more -- the VMs are created where the control plane runs.
#
# infra_kubeconfig is a credential for the hosting cluster. These tasks run on
# the ACM bastion, which has no kubeconfig for TNF of its own; 'make acm-site'
# writes one there for exactly this kind of reach.

- name: Set the name for this guest cluster
  ansible.builtin.set_fact:
    guest_name: "{{ guest_cluster_prefix }}-{{ guest_index }}"

- name: "{{ guest_name }}: create the hosted-cluster namespace on the infra cluster"
  kubernetes.core.k8s:
    kubeconfig: "{{ guest_infra_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ hcp_namespace }}"

- name: "{{ guest_name }}: put the pull secret beside the cluster"
  kubernetes.core.k8s:
    kubeconfig: "{{ guest_infra_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ guest_name }}-pull-secret"
        namespace: "{{ hcp_namespace }}"
      type: kubernetes.io/dockerconfigjson
      # Built as one expression, because pull_secret is JSON text and Ansible
      # converts a templated value that looks like a literal back into one. Set
      # as `.dockerconfigjson: "{{ pull_secret }}"` it arrives as an object and
      # the API server rejects the Secret; wrapped, the conversion produces the
      # mapping and the value inside it stays a string.
      stringData: "{{ {'.dockerconfigjson': pull_secret} }}"
  no_log: true

# Generated once and then left alone. 'hcp create' mints this itself; rendering
# manifests means nothing does unless we do. Rotating it out from under a
# running guest would make its etcd unreadable, so an existing key is kept.
- name: "{{ guest_name }}: look for an existing etcd encryption key"
  ansible.builtin.command: >-
    oc --kubeconfig {{ guest_infra_kubeconfig }}
    get secret {{ guest_name }}-etcd-encryption-key -n {{ hcp_namespace }} -o name
  register: etcd_key
  changed_when: false
  failed_when: false

- name: "{{ guest_name }}: create the etcd encryption key"
  kubernetes.core.k8s:
    kubeconfig: "{{ guest_infra_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ guest_name }}-etcd-encryption-key"
        namespace: "{{ hcp_namespace }}"
      type: Opaque
      data:
        # aescbc wants 32 bytes, base64 encoded.
        key: "{{ lookup('password', '/dev/null length=32 chars=hexdigits') | b64encode }}"
  no_log: true
  when: etcd_key.rc != 0

- name: "{{ guest_name }}: create the site folder"
  ansible.builtin.file:
    path: "{{ site_infra_repo_dir }}/{{ guest_name }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: "{{ guest_name }}: write the site definition"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ site_infra_repo_dir }}/{{ guest_name }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - {src: sites-infra-hcp-namespace.yaml.j2, dest: namespace.yaml}
    - {src: sites-infra-extra-manifests.yaml.j2, dest: extra-manifests.yaml}
    - {src: sites-infra-hostedcluster.yaml.j2, dest: hostedcluster.yaml}
    - {src: sites-infra-nodepool.yaml.j2, dest: nodepool.yaml}
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: localhost

# The hub-hosted definition, if an earlier run of this stage left one. Leaving
# it means the sites/ ApplicationSet keeps a ClusterInstance on the hub that
# builds the same cluster the other way, and two HyperShift operators would each
# create a control plane for {{ guest_name }}.
- name: "{{ guest_name }}: remove any hub-hosted definition left behind"
  ansible.builtin.file:
    path: "{{ site_repo_dir }}/{{ guest_name }}"
    state: absent
  delegate_to: localhost

- name: "{{ guest_name }}: report what to commit"
  ansible.builtin.debug:
    msg: >-
      {{ guest_name }}: definition written to
      {{ site_infra_repo_dir }}/{{ guest_name }}/ -- applied to the infra
      cluster, where its control plane and its worker VMs both run.
