---
# Create the virtualized control-plane guest clusters.
#
# Each guest cluster's control plane runs as pods on this hub; its worker nodes
# are KubeVirt VMs on the same two g4dn.metal machines, each holding real T4s
# passed through from the node labelled vm-passthrough.

- name: Install the hcp CLI
  ansible.builtin.include_tasks: install-hcp-cli.yml

- name: Create the hosted cluster namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ hcp_namespace }}"

- name: Create the guest artifact directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ guest_kubeconfig_dir }}"
    - "{{ guest_workdir }}/guest-manifests"

- name: Write the pull secret for the guest clusters
  ansible.builtin.copy:
    content: "{{ pull_secret }}"
    dest: "{{ guest_workdir }}/pull-secret.json"
    mode: '0600'

# The VMs land on the infra cluster, so that is where the GPUs have to be --
# not on the hub this role is talking to. Checked before anything is created,
# because the alternative is a NodePool that sits Pending for its whole timeout
# with "Insufficient nvidia.com/..." buried in a pod event.
- name: Count the passthrough GPUs available to the guests
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get nodes -o json
    | jq --arg r "{{ gpu_resource_name }}"
    '[.items[].status.allocatable[$r] // "0" | tonumber] | add'
  environment:
    KUBECONFIG: "{{ guest_infra_kubeconfig | default(op_kubeconfig) }}"
  register: passthrough_supply
  changed_when: false

- name: Fail if the guests would need more GPUs than exist
  ansible.builtin.assert:
    that: gpu_demand | int <= (passthrough_supply.stdout | trim | int)
    fail_msg: >-
      {{ guest_cluster_count }} guest clusters x {{ guest_nodepool_replicas }}
      workers x {{ guest_gpus_per_node }} GPUs needs {{ gpu_demand }}
      {{ gpu_resource_name }}, and the infra cluster offers
      {{ passthrough_supply.stdout | trim }}. Lower guest_gpus_per_node or
      guest_nodepool_replicas, or pass through more of each node's GPUs.
    success_msg: >-
      {{ gpu_demand }} of {{ passthrough_supply.stdout | trim }} passthrough
      GPUs will be used
  vars:
    gpu_demand: >-
      {{ guest_cluster_count | int
         * guest_nodepool_replicas | int
         * guest_gpus_per_node | int }}

- name: Create each guest cluster
  ansible.builtin.include_tasks: create-guest.yml
  loop: "{{ range(1, (guest_cluster_count | int) + 1) | list }}"
  loop_control:
    loop_var: guest_index
    label: "{{ guest_cluster_prefix }}-{{ guest_index }}"
