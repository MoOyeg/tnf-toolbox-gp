---
op_kubeconfig: ""
# Where the pull secret and the rendered guest manifests are staged. Defaults to
# the TNF install dir, because that is the bastion this normally runs from; the
# ACM site overrides it, since TNF's install dir does not exist over there.
guest_workdir: "{{ install_dir }}"
nodepool_timeout: 3600

# A public entry point for the guest's control plane, in front of the NodePorts.
#
# Off by default, and the default is the tested path. With it off the guest's
# services are published on the hub's private address: correct for the worker
# VMs, and unusable from a browser, because the console redirects to OAuth and
# the redirect names a 10.x address nothing outside the VPC can reach.
#
# Turning it on moves APIServer and OAuthServer to the load balancer's public
# name. That is what makes console login work from a workstation -- and it also
# changes the address the *worker VMs* use to reach the API server, sending that
# traffic out through the VPC's internet path rather than across the peering.
# The VMs have egress, so it should work; it has not been run end to end.
guest_public_control_plane: false

# Pinned so the load balancer can be built before the guest exists. Left to
# HyperShift these are allocated at creation, and the stack would have to be
# built afterwards from whatever it happened to choose.
guest_api_nodeport: 30443
guest_oauth_nodeport: 30444

# Each worker VM's root disk, and so the whole filesystem of a guest node.
# GUEST_VM_ROOT_DISK in config/instance.env is passed as an extra var and wins
# over this; the default is here so a direct ansible-playbook run still gets a
# workable size rather than failing on an undefined variable.
#
# 64Gi was too small and evicted builds: a worker carries ~25GiB of platform
# images before the app arrives, and the app adds a 6.6GiB analyzer, a 12.2GiB
# vLLM and roughly 20GiB of transient space while the analyzer image is built.
# The volumes are thin-provisioned (lvms thin-pool-1, overprovision 10), so the
# ceiling costs nothing until it is written into.
guest_vm_root_disk: 200Gi

# The node address the guest's control-plane services are published on. It must
# be a node of the cluster hosting the control plane, reachable from the guest's
# worker VMs -- which run on TNF while the control plane runs on the ACM hub, so
# they reach it across the VPC peering.
#
# Deliberately not named after an extra var: extra vars outrank include_role
# parameters, so a caller's override would be silently discarded.
guest_api_address: "{{ master0_private_ip }}"

# hcp defaults the control plane to HighlyAvailable, which runs etcd as a
# three-replica StatefulSet with anti-affinity across three nodes. Neither hub
# here has three: the ACM hub is a single node and TNF is a pair. etcd-1 and
# etcd-2 stay Pending with their PVCs unbound, etcd-0 crashloops because it can
# never reach quorum, and the hosted control plane never comes up.
guest_control_plane_availability: SingleReplica
# Likewise inside the guest, which has one worker VM.
guest_infra_availability: SingleReplica
