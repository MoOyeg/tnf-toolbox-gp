---
# Prepare the bare metal nodes for GPU passthrough: the GPUs are visible and the
# IOMMU is on. Which node's GPUs go to containers and which to virtual machines
# is not decided here -- that label is set by the GPU stage, which is the one
# that reads it (roles/gpu-operator/tasks/workload-labels.yml).
#
# The split is per node, not per GPU. The GPU Operator binds every GPU on a
# node to one driver: either the NVIDIA driver (containers) or vfio-pci (VM
# passthrough), and its driver container unbinds vfio-pci from every device on
# the node before installing, so a per-GPU split does not survive. That was
# measured, not assumed -- see defect 37 in docs/deploy-log.md.
#
# Both nodes are vm-passthrough here, so all sixteen T4s are available to guest
# VMs and a guest's workers can spread across both machines. See
# docs/gpu-allocation.md.

# Nothing below can run against a node that is rebooting, and re-running this
# role during an in-flight MachineConfig rollout is normal. `oc debug` on a
# NotReady node does not fail fast -- it blocked for nearly eight minutes before
# giving up with a confusing "pods/log ... not found".
- name: Wait for every control-plane node to be Ready and schedulable
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get nodes -o json
    | jq -r '.items[]
    | "\(.metadata.name) \(([.status.conditions[] | select(.type=="Ready") | .status] | first)) \(.spec.unschedulable // false)"'
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  register: node_readiness
  changed_when: false
  failed_when: false
  retries: "{{ (mcp_rollout_timeout | int / 30) | int }}"
  delay: 30
  until:
    - node_readiness.rc == 0
    - node_readiness.stdout_lines | length == control_plane_nodes | length
    - node_readiness.stdout_lines | select('search', ' True false$') | list | length == control_plane_nodes | length

- name: Confirm the GPUs are visible to the nodes
  ansible.builtin.command: >-
    oc debug node/{{ item.name }} --quiet --request-timeout=120s --
    chroot /host bash -c "lspci -d 10de: -nn | wc -l"
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: gpu_count
  changed_when: false
  retries: 5
  delay: 30
  until: gpu_count is not failed

- name: Report the GPU count per node
  ansible.builtin.debug:
    msg: "{{ item.item.name }}: {{ item.stdout | trim }} NVIDIA devices"
  loop: "{{ gpu_count.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Fail if a node reports no GPUs
  ansible.builtin.assert:
    that: item.stdout | trim | int > 0
    fail_msg: >-
      {{ item.item.name }} reports no NVIDIA devices. It is probably not a
      g4dn.metal instance -- only bare metal instance types expose the T4s as
      PCI devices.
  loop: "{{ gpu_count.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Ask the nodes what they are actually booted with before touching anything.
#
# The apply below is idempotent, so an unchanged MachineConfig does not reboot
# anything -- but "unchanged" is a property of the object, not of the nodes. Edit
# the kernel argument list, or lose and recreate the MachineConfig, and the MCO
# reboots both nodes serially even though /proc/cmdline already says what it is
# about to say. On a two-node control plane that is half the cluster gone for
# forty minutes, so it is worth being certain first.
- name: Check whether the IOMMU kernel arguments are already in place
  ansible.builtin.command: >-
    oc debug node/{{ item.name }} --quiet --request-timeout=120s -- chroot /host bash -c 'for a in {{ iommu_kernel_args | join(" ") }}; do grep -qw -- $a /proc/cmdline || { echo missing; exit 0; }; done; echo present'
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: iommu_state
  changed_when: false
  # A node that has just been uncordoned can refuse a debug pod for a few
  # seconds, so an empty answer is retried. It is never *interpreted*: a node
  # that has not answered is not evidence that its arguments are in place, and
  # reading it as such would skip a reboot the cluster actually needs. If it
  # still cannot be determined, the stage stops rather than guessing.
  retries: 5
  delay: 30
  until: iommu_state.stdout | default('') | trim in ['present', 'missing']
  failed_when: iommu_state.stdout | default('') | trim not in ['present', 'missing']

# The MachineConfig has to exist as well as the arguments being live: without it
# a rebuilt node comes back without them.
- name: Look for the IOMMU MachineConfig
  ansible.builtin.command: "oc get machineconfig {{ machine_config_name }} -o name"
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  register: iommu_mc_present
  changed_when: false
  failed_when: false

- name: Record what is left to do
  ansible.builtin.set_fact:
    iommu_nodes_missing: >-
      {{ iommu_state.results
         | rejectattr('stdout', 'equalto', 'present')
         | map(attribute='item.name') | list }}

- name: Decide whether anything needs applying
  ansible.builtin.set_fact:
    # Either a node is missing the arguments, or the MachineConfig that keeps
    # them across a rebuild is gone. Only the first causes a reboot.
    iommu_work_needed: >-
      {{ (iommu_nodes_missing | length > 0) or (iommu_mc_present.rc != 0) }}

- name: Report that the IOMMU is already enabled
  when: not iommu_work_needed | bool
  ansible.builtin.debug:
    msg: >-
      {{ iommu_kernel_args | join(' ') }} already on every node and
      {{ machine_config_name }} is in place. Nothing to apply, and no reboot.

- name: Report what will be rebooted
  when: iommu_work_needed | bool
  ansible.builtin.debug:
    msg: >-
      {{ ('nodes without the arguments: ' ~ (iommu_nodes_missing | join(', ')))
         if iommu_nodes_missing | length > 0
         else (machine_config_name ~ ' is missing, so it will be recreated') }}.
      Applying it reboots the {{ target_mcp }} pool one node at a time.

# Read before the apply, so the wait can tell a real re-render from the old
# target still being reported.
- name: Read the pool's rendered config before changing anything
  ansible.builtin.command: >-
    oc get mcp {{ target_mcp }} -o jsonpath={.spec.configuration.name}
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  register: mcp_before
  changed_when: false
  failed_when: false

- name: Enable the IOMMU on the control-plane nodes
  when: iommu_work_needed | bool
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig | default(kubeconfig) }}"
    state: present
    definition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfig
      metadata:
        name: "{{ machine_config_name }}"
        labels:
          machineconfiguration.openshift.io/role: "{{ target_mcp }}"
      spec:
        kernelArguments: "{{ iommu_kernel_args }}"
  register: iommu_mc

# This reboots both nodes, one at a time. On a two-node cluster that means
# running on a single control-plane node for part of it, so it is worth doing
# before anything is deployed on top rather than after.
- name: Wait for the MachineConfig rollout
  when: iommu_work_needed | bool
  ansible.builtin.include_tasks: wait-mcp.yml
  vars:
    required_machine_config: "{{ machine_config_name }}"
    # Only when this run actually changed the MachineConfig. Passing it on an
    # unchanged re-run would wait for a re-render that will never happen.
    previous_rendered_config: >-
      {{ mcp_before.stdout | default('') if iommu_mc.changed | default(false) else '' }}

# Bounded and retried for the same reason as the check above: a node that has
# just been uncordoned can still refuse a debug pod for a few seconds.
- name: Verify the IOMMU is actually on
  ansible.builtin.command: >-
    oc debug node/{{ item.name }} --quiet --request-timeout=120s --
    chroot /host bash -c "test -d /sys/kernel/iommu_groups && ls /sys/kernel/iommu_groups | wc -l"
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: iommu_groups
  changed_when: false
  retries: 5
  delay: 30
  until: iommu_groups.rc == 0 and (iommu_groups.stdout | trim | int) > 0
  failed_when: iommu_groups.rc != 0 or (iommu_groups.stdout | trim | int) == 0

- name: Report the IOMMU group count
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}: {{ item.stdout | trim }} IOMMU groups
  loop: "{{ iommu_groups.results }}"
  loop_control:
    label: "{{ item.item.name }}"
