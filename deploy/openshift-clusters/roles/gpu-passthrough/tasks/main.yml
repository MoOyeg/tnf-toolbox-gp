---
# Prepare the bare metal nodes for GPU passthrough: every node keeps half its
# GPUs for containers and passes the other half to virtual machines.
#
# A GPU still has exactly one driver, but the split is per GPU rather than per
# node. The GPU Operator cannot express that -- sandboxWorkloads labels a whole
# node and its vfio-manager binds every GPU on it the same way -- so the
# passthrough half is bound here instead, by a systemd unit that runs before
# the operator's driver container loads nvidia.ko. The operator then finds only
# the GPUs still available to it, and KubeVirt advertises the vfio-bound ones
# itself.
#
# The point is that neither capability is stranded on one machine: losing a node
# costs half of each, not all of one. See docs/gpu-allocation.md.

# Nothing below can run against a node that is rebooting, and re-running this
# role during an in-flight MachineConfig rollout is normal. `oc debug` on a
# NotReady node does not fail fast -- it blocked for nearly eight minutes before
# giving up with a confusing "pods/log ... not found".
- name: Wait for every control-plane node to be Ready and schedulable
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get nodes -o json
    | jq -r '.items[]
    | "\(.metadata.name) \(([.status.conditions[] | select(.type=="Ready") | .status] | first)) \(.spec.unschedulable // false)"'
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  register: node_readiness
  changed_when: false
  failed_when: false
  retries: "{{ (mcp_rollout_timeout | int / 30) | int }}"
  delay: 30
  until:
    - node_readiness.rc == 0
    - node_readiness.stdout_lines | length == control_plane_nodes | length
    - node_readiness.stdout_lines | select('search', ' True false$') | list | length == control_plane_nodes | length

- name: Confirm the GPUs are visible to the nodes
  ansible.builtin.command: >-
    oc debug node/{{ item.name }} --quiet --request-timeout=120s --
    chroot /host bash -c "lspci -d 10de: -nn | wc -l"
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: gpu_count
  changed_when: false
  retries: 5
  delay: 30
  until: gpu_count is not failed

- name: Report the GPU count per node
  ansible.builtin.debug:
    msg: "{{ item.item.name }}: {{ item.stdout | trim }} NVIDIA devices"
  loop: "{{ gpu_count.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Fail if a node reports no GPUs
  ansible.builtin.assert:
    that: item.stdout | trim | int > 0
    fail_msg: >-
      {{ item.item.name }} reports no NVIDIA devices. It is probably not a
      g4dn.metal instance -- only bare metal instance types expose the T4s as
      PCI devices.
  loop: "{{ gpu_count.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Read before the apply, so the wait can tell a real re-render from the old
# target still being reported.
- name: Read the pool's rendered config before changing anything
  ansible.builtin.command: >-
    oc get mcp {{ target_mcp }} -o jsonpath={.spec.configuration.name}
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  register: mcp_before
  changed_when: false
  failed_when: false

- name: Enable the IOMMU on the control-plane nodes
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig | default(kubeconfig) }}"
    state: present
    definition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfig
      metadata:
        name: "{{ machine_config_name }}"
        labels:
          machineconfiguration.openshift.io/role: "{{ target_mcp }}"
      spec:
        kernelArguments: "{{ iommu_kernel_args }}"
        # Same MachineConfig as the kernel arguments on purpose: both need a
        # reboot, and on two nodes each reboot runs the cluster on one.
        config:
          ignition:
            version: 3.4.0
          storage:
            files:
              - path: "{{ gpu_split_script_path }}"
                mode: 493
                overwrite: true
                contents:
                  source: >-
                    data:text/plain;charset=utf-8;base64,{{
                      lookup('template', 'gpu-vfio-split.sh.j2') | b64encode
                    }}
          systemd:
            units:
              - name: "{{ gpu_split_unit_name }}"
                enabled: true
                contents: |
                  [Unit]
                  Description=Bind half of this node's GPUs to vfio-pci
                  After=systemd-modules-load.service
                  Before=kubelet.service
                  [Service]
                  Type=oneshot
                  RemainAfterExit=yes
                  ExecStart={{ gpu_split_script_path }}
                  [Install]
                  WantedBy=multi-user.target
  register: iommu_mc

# This reboots both nodes, one at a time. On a two-node cluster that means
# running on a single control-plane node for part of it, so it is worth doing
# before anything is deployed on top rather than after.
- name: Wait for the MachineConfig rollout
  ansible.builtin.include_tasks: wait-mcp.yml
  vars:
    required_machine_config: "{{ machine_config_name }}"
    # Only when this run actually changed the MachineConfig. Passing it on an
    # unchanged re-run would wait for a re-render that will never happen.
    previous_rendered_config: "{{ mcp_before.stdout | default('') if iommu_mc.changed else '' }}"

# Every node is a container node as far as the operator is concerned. The
# passthrough half is already bound to vfio-pci by the time its driver starts,
# so it never sees those GPUs -- which is the only way to get both kinds on one
# machine.
- name: Label each node for container workloads
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig | default(kubeconfig) }}"
    state: patched
    kind: Node
    name: "{{ item.name }}"
    definition:
      metadata:
        # The whole mapping is built inside one expression. Ansible does not
        # reliably template a dictionary *key* written as "{{ var }}:" in a
        # nested module argument -- it arrives at the API server as the literal
        # string, and the request is rejected as an invalid label name.
        labels: "{{ {gpu_device_label: item.gpu_workload} }}"
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.gpu_workload }}"

# Bounded and retried for the same reason as the check above: a node that has
# just been uncordoned can still refuse a debug pod for a few seconds.
- name: Verify the IOMMU is actually on
  ansible.builtin.command: >-
    oc debug node/{{ item.name }} --quiet --request-timeout=120s --
    chroot /host bash -c "test -d /sys/kernel/iommu_groups && ls /sys/kernel/iommu_groups | wc -l"
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: iommu_groups
  changed_when: false
  retries: 5
  delay: 30
  until: iommu_groups.rc == 0 and (iommu_groups.stdout | trim | int) > 0
  failed_when: iommu_groups.rc != 0 or (iommu_groups.stdout | trim | int) == 0

- name: Report the IOMMU group count
  ansible.builtin.debug:
    msg: "{{ item.item.name }}: {{ item.stdout | trim }} IOMMU groups"
  loop: "{{ iommu_groups.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# The split is the whole point of this role, so it is checked rather than
# assumed. Counted from the driver each device is actually bound to, not from
# what the unit was asked to do.
- name: Count how each node's GPUs are bound
  ansible.builtin.command: >-
    oc debug node/{{ item.name }} --quiet --request-timeout=120s --
    chroot /host bash -c
    'v=0; n=0;
     for d in /sys/bus/pci/devices/*; do
       [ "$(cat $d/vendor 2>/dev/null)" = "0x{{ gpu_pci_vendor_device.split(":")[0] | lower }}" ] || continue;
       [ "$(cat $d/device 2>/dev/null)" = "0x{{ gpu_pci_vendor_device.split(":")[1] | lower }}" ] || continue;
       drv=$(basename $(readlink -f $d/driver 2>/dev/null) 2>/dev/null);
       if [ "$drv" = "vfio-pci" ]; then v=$((v+1)); else n=$((n+1)); fi;
     done; echo "$v $n"'
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: gpu_split
  changed_when: false
  retries: 10
  delay: 30
  until: gpu_split is not failed and (gpu_split.stdout | default('') | trim | length) > 0

- name: Fail if a node did not end up with both kinds of GPU
  ansible.builtin.assert:
    that:
      - item.stdout.split()[0] | int > 0
      - item.stdout.split()[1] | int > 0
    fail_msg: >-
      {{ item.item.name }} has {{ item.stdout.split()[0] }} GPUs on vfio-pci and
      {{ item.stdout.split()[1] }} left for the NVIDIA driver. Both halves are
      needed on every node. If vfio-pci has none, {{ gpu_split_unit_name }} did
      not run or ran after nvidia.ko had already claimed them; if the driver has
      none, the unit bound too many.
    success_msg: >-
      {{ item.item.name }}: {{ item.stdout.split()[0] }} GPUs passed through,
      {{ item.stdout.split()[1] }} kept for containers
  loop: "{{ gpu_split.results }}"
  loop_control:
    label: "{{ item.item.name }}"
