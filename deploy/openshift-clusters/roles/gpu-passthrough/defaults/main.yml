---
# The kernel arguments and the pool live in group_vars: the install writes them
# into the day-1 manifests, and this role reads the same values to decide
# whether a cluster built before that already has them.
machine_config_name: "{{ iommu_machine_config_name | default('100-master-gpu-passthrough') }}"
target_mcp: "{{ iommu_target_mcp | default('master') }}"
