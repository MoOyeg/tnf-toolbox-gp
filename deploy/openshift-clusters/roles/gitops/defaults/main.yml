---
# OpenShift GitOps, and the ApplicationSet that turns the generated site folders
# into one Argo CD Application per cluster.
#
# The point of this role is that Git becomes the thing the hub reconciles
# against. Ansible generates the site definitions and stops; from then on the
# fleet is whatever is committed, and a ClusterInstance edited by hand on the
# hub is put back.
op_kubeconfig: ""

gitops_package: openshift-gitops-operator
# An AllNamespaces operator: it installs into openshift-operators and stands the
# Argo CD instance up in a namespace of its own.
gitops_namespace: openshift-operators
gitops_argocd_namespace: openshift-gitops
gitops_channel: auto
gitops_ready_timeout: 900

gitops_applicationset_name: fleet-sites
# The service account Argo CD reconciles with. A ClusterInstance is a
# cluster-scoped concern -- it creates namespaces, ManagedClusters and
# ClusterDeployments across the hub -- so the controller needs more than the
# namespace-scoped role the operator gives it by default.
gitops_controller_sa: openshift-gitops-argocd-application-controller

# How Argo CD is given access to the infra cluster. ACM owns the cluster
# secrets: a Placement picks the managed clusters and a GitOpsCluster hands them
# to Argo, which is tidier than minting a cluster secret from a kubeconfig and
# then having to rotate it.
# gitops_cluster_set is not here: vcp-cluster's Policy needs the same set name
# for its own Placement, and a role's defaults are invisible to every other
# role. It lives in group_vars/all.yml.
gitops_infra_placement: fleet-infra

# ---------------------------------------------------------------- pull model
# The fleet's workloads are delivered by ACM's pull model rather than pushed:
# the hub wraps each Application in a ManifestWork and the cluster's own agent
# collects it, so no credential leaves the hub and nothing reaches inward.
#
# Separate Placement and GitOpsCluster from the fleet-infra pair above, and
# deliberately so: that one selects exactly the infra cluster for the push path,
# this one selects the whole fleet. One Placement doing both would mean tnf-gp
# was pushed to and pulled from at once.
gitops_fleet_placement: fleet-workloads
gitops_fleet_applicationset: fleet-workloads
# The label every ManagedCluster in this toolbox carries -- set by
# import-cluster.yml for the infra cluster and by both SiteConfig template sets
# for the clusters ACM builds.
gitops_fleet_label: tnf-toolbox-gp/fleet
# gitops_fleet_repo_path is not here: the app role writes into that tree and a
# role's defaults are invisible to every other role. It lives in group_vars.
# The ConfigMap the clusterDecisionResource generator reads PlacementDecisions
# through. ACM does not create it here, so the role does.
gitops_placement_generator: ocm-placement-generator
# The Argo CD instance the operator stands up by default. Named here because the
# fleet policy asserts it exists on every managed cluster, and main.yml waits for
# it on the hub -- the name was a literal in one place and is now needed in two.
gitops_argocd_instance: openshift-gitops

