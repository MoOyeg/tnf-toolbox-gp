---
# Make the fleet virtualization view work, and prove it.
#
# The view is not powered by OpenShift Virtualization on the hub. Per the ACM
# documentation it needs the operator on the clusters you want to *manage*, and
# the hub's Search service to list the VirtualMachine resources it finds there.
# The hub does not have CNV and does not need it: it runs no virtual machines,
# and the only thing it loses by not having the operator is a Virtualization
# section in its own console that would have described nothing.
#
# So what this does is make the two things the view actually depends on explicit
# rather than incidental: Search on the hub, and the search collector on every
# managed cluster. Both are defaults, and a default is a poor thing to depend on
# silently when the symptom of losing it is an empty page.
#
# Actions on those VMs -- start, stop, restart, snapshot -- are no longer a
# feature to switch on. The toggle was deprecated in ACM 2.14 in favour of
# fine-grained RBAC, so there is nothing to enable here for them.

- name: Ensure the Search service is enabled on the hub
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: patched
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    name: "{{ multiclusterhub_name }}"
    namespace: "{{ acm_namespace }}"
    definition:
      spec:
        overrides:
          components:
            - name: search
              enabled: true
  register: mch_search
  retries: 20
  delay: 15
  until: mch_search is not failed

- name: Wait for Search to be running
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get pods -n {{ acm_namespace }} -l app=search --no-headers 2>/dev/null
    | grep -c Running
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: search_pods
  changed_when: false
  failed_when: false
  retries: 40
  delay: 15
  until: search_pods.stdout | trim | int > 0

- name: Fail if Search never came up
  ansible.builtin.assert:
    that: search_pods.stdout | trim | int > 0
    fail_msg: >-
      No Search pods are running in {{ acm_namespace }}. The fleet
      virtualization view lists VirtualMachine resources through Search, so
      without it the page is empty however many VMs the managed clusters run.

- name: Report what the fleet view depends on
  ansible.builtin.debug:
    msg:
      - "Search is running: the console can list VirtualMachines across managed clusters."
      - "Each managed cluster needs OpenShift Virtualization and the search-collector"
      - "addon -- import-cluster.yml enables the addon, and TNF is where the VMs run."
