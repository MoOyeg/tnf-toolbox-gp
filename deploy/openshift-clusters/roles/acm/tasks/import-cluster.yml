---
# Import an existing cluster into the hub as a ManagedCluster.
#
# ACM auto-imports the clusters it creates itself -- local-cluster, and every
# HostedCluster it provisions -- but not one that was already there. TNF is
# where the guest clusters' VMs and GPUs actually run, so until it is imported
# the hub can see the hosted clusters but not the infrastructure underneath
# them.
#
# The target is named by import_cluster_name and reached with
# import_cluster_kubeconfig. Deliberately not cluster_name: that is an extra
# var, and extra vars outrank include_role parameters, so a caller's value would
# be accepted and then discarded.

- name: "Create the hub namespace for {{ import_cluster_name }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ import_cluster_name }}"

- name: "Register {{ import_cluster_name }} with the hub"
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: cluster.open-cluster-management.io/v1
      kind: ManagedCluster
      metadata:
        name: "{{ import_cluster_name }}"
        labels:
          name: "{{ import_cluster_name }}"
          cloud: Amazon
          vendor: OpenShift
          # What a Placement selects the fleet on. The per-cluster name label
          # above picks exactly one cluster by design; this one says "a cluster
          # this toolbox manages", which is the question a fleet-wide Placement
          # is actually asking.
          tnf-toolbox-gp/fleet: "true"
      spec:
        hubAcceptsClient: true

- name: "Enable the klusterlet addons on {{ import_cluster_name }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: agent.open-cluster-management.io/v1
      kind: KlusterletAddonConfig
      metadata:
        name: "{{ import_cluster_name }}"
        namespace: "{{ import_cluster_name }}"
      spec:
        clusterName: "{{ import_cluster_name }}"
        clusterNamespace: "{{ import_cluster_name }}"
        clusterLabels:
          cloud: Amazon
          vendor: OpenShift
        applicationManager:
          enabled: true
        policyController:
          enabled: true
        searchCollector:
          enabled: true
        certPolicyController:
          enabled: true

# The hub generates the manifests asynchronously once the ManagedCluster exists.
- name: "Wait for the hub to generate {{ import_cluster_name }}'s import manifests"
  ansible.builtin.command: >-
    oc get secret {{ import_cluster_name }}-import
    -n {{ import_cluster_name }} -o jsonpath='{.data.import\.yaml}'
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: import_secret
  changed_when: false
  failed_when: false
  retries: 30
  delay: 10
  until: import_secret.rc == 0 and import_secret.stdout | length > 0

- name: Fail if the hub never produced the import manifests
  ansible.builtin.assert:
    that: import_secret.stdout | length > 0
    fail_msg: >-
      {{ import_cluster_name }}-import was never populated in namespace
      {{ import_cluster_name }}. Without it the klusterlet cannot be installed
      on the target cluster.

# crds.yaml first: import.yaml contains the custom resources those CRDs define,
# and applying it first fails with "no matches for kind Klusterlet".
- name: "Install the klusterlet on {{ import_cluster_name }}"
  ansible.builtin.shell: |
    set -o pipefail
    manifest() {
      oc --kubeconfig {{ op_kubeconfig }} get secret {{ import_cluster_name }}-import \
        -n {{ import_cluster_name }} -o jsonpath="{.data.${1//./\\.}}" | base64 -d
    }
    manifest crds.yaml | oc --kubeconfig {{ import_cluster_kubeconfig }} apply -f -
    # A CRD is stored the moment it is created but served only once it is
    # Established, and import.yaml carries a Klusterlet -- so applied straight
    # after, on a cluster seeing these CRDs for the first time, it fails with
    # "no matches for kind Klusterlet". A re-run passes, because by then they
    # exist: which is why this only ever broke a fresh import.
    manifest crds.yaml \
      | oc --kubeconfig {{ import_cluster_kubeconfig }} wait -f - \
          --for=condition=Established --timeout=120s
    manifest import.yaml | oc --kubeconfig {{ import_cluster_kubeconfig }} apply -f -
  register: klusterlet_applied
  changed_when: "'created' in klusterlet_applied.stdout or 'configured' in klusterlet_applied.stdout"

# Available means the klusterlet came up on the target and is talking back to
# the hub. Joined alone only means the registration was accepted.
#
# Three waits follow, and together they can block for over half an hour. That is
# right for a stage whose job is to import a cluster and wrong for one that
# renders site definitions and imports as a follow-on -- there, a guest that is
# still installing would stop the run before it reaches the steps the *other*
# clusters need, which is how 'make sites' came to leave an all-VM cluster
# without its DNS records. Callers that only want the import started set
# import_wait_online false and read the result from the hub later.
- name: "Wait for {{ import_cluster_name }} to come online in the hub"
  when: import_wait_online | default(true) | bool
  ansible.builtin.command: >-
    oc get managedcluster {{ import_cluster_name }}
    -o jsonpath='{.status.conditions[?(@.type=="ManagedClusterConditionAvailable")].status}'
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: managed_available
  changed_when: false
  retries: "{{ (managed_cluster_timeout | int / 20) | int }}"
  delay: 20
  until: managed_available.stdout == "True"

# The fleet virtualization view lists VirtualMachines that this addon reports
# to the hub's Search. Without it the cluster is managed but its VMs are
# invisible, which looks like a console fault rather than a missing addon.
- name: "Wait for {{ import_cluster_name }}'s search collector to be available"
  when: import_wait_online | default(true) | bool
  ansible.builtin.command: >-
    oc get managedclusteraddon search-collector -n {{ import_cluster_name }}
    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: search_addon
  changed_when: false
  failed_when: false
  retries: 30
  delay: 20
  until: search_addon.stdout == "True"

# The addon that enforces a ConfigurationPolicy on this cluster. policyController
# is enabled above, but enabling it and it being ready are different things, and
# the gap is silent: a Policy the hub considers propagated does nothing at all
# until this is Available, with no event on either side saying why. The all-VM
# cluster's virtual machines are created by exactly such a Policy.
- name: "Wait for {{ import_cluster_name }}'s config policy controller to be available"
  when: import_wait_online | default(true) | bool
  ansible.builtin.command: >-
    oc get managedclusteraddon config-policy-controller -n {{ import_cluster_name }}
    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: policy_addon
  changed_when: false
  failed_when: false
  retries: 30
  delay: 20
  until: policy_addon.stdout == "True"

- name: "{{ import_cluster_name }}: import started, not waited on"
  ansible.builtin.debug:
    msg: >-
      {{ import_cluster_name }}'s klusterlet has been installed. Not waiting for
      it to report Available -- it will once the cluster finishes coming up.
  when: not (import_wait_online | default(true) | bool)

- name: "Report {{ import_cluster_name }}"
  when: import_wait_online | default(true) | bool
  ansible.builtin.debug:
    msg:
      - "{{ import_cluster_name }} is imported into the hub and reporting Available."
      - >-
        search-collector {{ 'is available, so its VirtualMachines appear in the
        fleet virtualization view' if search_addon.stdout == 'True'
        else 'is not available yet; its VMs will not show in the fleet view
        until it is' }}.
      - >-
        config-policy-controller {{ 'is available, so Policies targeting this
        cluster will be enforced' if policy_addon.stdout == 'True'
        else 'is NOT available; Policies targeting this cluster will be
        propagated and then quietly do nothing' }}.
