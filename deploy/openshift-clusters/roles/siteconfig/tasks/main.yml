---
# Enable the SiteConfig operator on the hub and install our install templates.
#
# Runs against the ACM hub. Everything here is idempotent: enabling a component
# that is already enabled is a no-op, and the templates are plain ConfigMaps.

- name: Read the MultiClusterHub's current component list
  ansible.builtin.command: >-
    oc get multiclusterhub {{ multiclusterhub_name }} -n {{ acm_namespace }}
    -o jsonpath={.spec.overrides.components}
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: mch_components
  changed_when: false

# Three states, not two, and the difference matters: ACM ships the component
# already listed and set to false. Testing only whether the name appears
# therefore reports "already enabled" about a hub where it is switched off --
# and because MCE installs the ClusterInstance CRD either way, everything
# downstream looks healthy while no controller exists to reconcile anything.
- name: Work out what the hub already says about SiteConfig
  ansible.builtin.set_fact:
    mch_component_names: >-
      {{ (mch_components.stdout | default('[]') | from_json)
         | map(attribute='name') | list }}
    siteconfig_enabled_now: >-
      {{ ((mch_components.stdout | default('[]') | from_json)
          | selectattr('name', 'equalto', siteconfig_component)
          | map(attribute='enabled') | list | first) | default(false) }}

# Appending when the entry is already there would leave the hub with two of
# them, so the two cases are patched differently.
- name: Add the SiteConfig component
  kubernetes.core.k8s_json_patch:
    kubeconfig: "{{ op_kubeconfig }}"
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    name: "{{ multiclusterhub_name }}"
    namespace: "{{ acm_namespace }}"
    patch:
      - op: add
        path: /spec/overrides/components/-
        value:
          name: "{{ siteconfig_component }}"
          enabled: true
  when: siteconfig_component not in mch_component_names

- name: Turn the SiteConfig component on
  kubernetes.core.k8s_json_patch:
    kubeconfig: "{{ op_kubeconfig }}"
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    name: "{{ multiclusterhub_name }}"
    namespace: "{{ acm_namespace }}"
    patch:
      - op: replace
        path: "/spec/overrides/components/{{ mch_component_names.index(siteconfig_component) }}/enabled"
        value: true
  when:
    - siteconfig_component in mch_component_names
    - not siteconfig_enabled_now | bool

- name: Report that SiteConfig was already on
  ansible.builtin.debug:
    msg: "SiteConfig is already enabled on this hub."
  when:
    - siteconfig_component in mch_component_names
    - siteconfig_enabled_now | bool

# The CRD is what everything downstream depends on: a ClusterInstance applied
# before it exists is rejected outright, and Argo CD would report the site
# Application permanently degraded rather than retrying into success.
- name: Wait for the ClusterInstance CRD
  ansible.builtin.command: >-
    oc get crd clusterinstances.siteconfig.open-cluster-management.io
    -o jsonpath={.metadata.name}
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: ci_crd
  changed_when: false
  failed_when: false
  retries: "{{ (siteconfig_enable_timeout | int / 15) | int }}"
  delay: 15
  until: ci_crd.rc == 0 and ci_crd.stdout | length > 0

- name: Fail if the CRD never appeared
  ansible.builtin.assert:
    that: ci_crd.rc == 0
    fail_msg: >-
      The SiteConfig operator did not install within
      {{ siteconfig_enable_timeout }}s. 'oc get multiclusterhub
      {{ multiclusterhub_name }} -n {{ acm_namespace }} -o yaml' shows which
      component is stuck.

- name: Report that the operator is ready
  ansible.builtin.debug:
    msg: >-
      SiteConfig is enabled. The install templates are created by the roles that
      own them: vcp-cluster for whole clusters on VMs, hcp-guest for hosted
      control planes on KubeVirt.
