---
# The ACM cluster: single-node OpenShift on bare metal at the ACM site, peered to
# the TNF site.
#
# It is a separate site rather than a VM on TNF so that the management plane does
# not share a failure domain with the cluster it manages -- losing TNF should not
# also lose the hub that would tell you TNF is gone.

# Paths and names live in group_vars, because the play's environment: block
# references them before role defaults are in scope.

acm_bootstrap_timeout: 3600
# How long to wait for TNF's kubeconfig to appear, when this stage is running
# alongside 'make tnf' rather than after it.
tnf_kubeconfig_wait: 5400
acm_install_timeout: 5400

# Credential the ACM cluster uses to reach TNF's MultiCluster Engine across the
# peering connection. The namespace it targets on TNF is acm_infra_namespace,
# in group_vars, because hcp-guest needs it too.
infra_kubeconfig_secret: tnf-infra-kubeconfig

# Pods per node on the hub. The default 250 is not enough for ACM plus MCE plus
# OpenShift Virtualization plus a hosted control plane for every guest cluster.
acm_max_pods: 500
