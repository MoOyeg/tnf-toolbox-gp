---
# The ACM cluster: single-node OpenShift on bare metal at the ACM site, peered to
# the TNF site.
#
# It is a separate site rather than a VM on TNF so that the management plane does
# not share a failure domain with the cluster it manages -- losing TNF should not
# also lose the hub that would tell you TNF is gone.
acm_cluster_name: acm
acm_sno_node_name: sno-0

# Where the ACM cluster's own install artifacts live on the ACM bastion.
acm_install_root: "/home/{{ ansible_user }}/clusters"
acm_install_dir: "{{ acm_install_root }}/{{ acm_cluster_name }}"
acm_kubeconfig: "{{ acm_install_dir }}/auth/kubeconfig"

acm_bootstrap_timeout: 3600
acm_install_timeout: 5400

# Credential the ACM cluster uses to reach TNF's MultiCluster Engine across the
# peering connection, and the namespace on TNF that VMs it creates land in.
# Deliberately not 'clusters', which TNF's own MCE uses for guests it hosts
# itself -- two HyperShift operators reconciling one namespace would each believe
# they owned it.
infra_kubeconfig_secret: tnf-infra-kubeconfig
acm_infra_namespace: acm-hosted-vms
hcp_namespace: clusters
