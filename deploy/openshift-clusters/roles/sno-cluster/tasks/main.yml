---
# Install the ACM cluster: single-node OpenShift on bare metal at the ACM site.
#
# Runs against the ACM site's own bastion, not TNF's. The two sites are joined by
# VPC peering; this role builds the ACM side, and infra-credentials.yml then
# teaches it to reach TNF's MultiCluster Engine across that connection.

- name: Look for an existing ACM cluster kubeconfig
  ansible.builtin.stat:
    path: "{{ acm_kubeconfig }}"
  register: acm_kubeconfig_stat

# Same lesson as the TNF install: auth/kubeconfig exists as soon as ignition is
# generated, so its presence proves nothing. Ask the cluster.
- name: Ask the ACM cluster whether it is actually installed
  ansible.builtin.command: >-
    oc --request-timeout=15s get clusterversion version
    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
  environment:
    KUBECONFIG: "{{ acm_kubeconfig }}"
  register: acm_clusterversion
  changed_when: false
  failed_when: false
  when: acm_kubeconfig_stat.stat.exists

- name: Record whether the ACM cluster is already up
  ansible.builtin.set_fact:
    acm_already_installed: >-
      {{ acm_kubeconfig_stat.stat.exists
         and acm_clusterversion.rc | default(1) == 0
         and acm_clusterversion.stdout | default('') == 'True' }}

- name: Install the ACM cluster
  when: not acm_already_installed
  block:
    - name: Generate install-config and ignition
      ansible.builtin.include_tasks: render.yml

    - name: Launch the node and its bootstrap
      ansible.builtin.include_tasks: launch.yml

    - name: Wait for the installation to finish
      ansible.builtin.include_tasks: wait.yml

# Applies whether or not this run installed the cluster: a hub built before the
# ceiling was raised needs it just as much as a fresh one.
- name: Raise the hub's pod ceiling
  ansible.builtin.include_tasks: pod-capacity.yml

- name: Report an existing ACM cluster
  when: acm_already_installed
  ansible.builtin.debug:
    msg: "{{ acm_cluster_name }} is already installed; skipping to ACM itself."
