---
# Render the SNO install-config and turn it into a bootable agent ISO.

- name: Create the SNO install directory
  ansible.builtin.file:
    path: "{{ sno_install_dir }}"
    state: directory
    mode: '0700'

- name: Render the SNO install-config and agent-config
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ sno_install_dir }}/{{ item }}"
    mode: '0600'
  loop:
    - install-config.yaml
    - agent-config.yaml

# Both are consumed in place by the agent installer, exactly as the TNF install
# consumes its own install-config. Keep copies or there is nothing to read back.
- name: Archive copies of the rendered configs
  ansible.builtin.copy:
    src: "{{ sno_install_dir }}/{{ item }}"
    dest: "{{ sno_install_dir }}/{{ item }}.bak"
    remote_src: true
    mode: '0600'
  loop:
    - install-config.yaml
    - agent-config.yaml

- name: Generate the agent ISO
  ansible.builtin.command: >-
    {{ bin_dir }}/openshift-install agent create image --dir {{ sno_install_dir }}
  args:
    creates: "{{ sno_install_dir }}/agent.x86_64.iso"

- name: Publish the ISO on the bastion's HTTP server
  ansible.builtin.copy:
    src: "{{ sno_install_dir }}/agent.x86_64.iso"
    dest: "{{ ignition_root }}/{{ sno_iso_name }}"
    remote_src: true
    mode: '0644'
  become: true

# CDI pulls the ISO over HTTP from inside the cluster, so a 404 here surfaces
# later as a DataVolume stuck importing with no obvious cause.
- name: Confirm the ISO is actually being served
  ansible.builtin.uri:
    url: "{{ ignition_base_url }}/{{ sno_iso_name }}"
    method: HEAD
  register: sno_iso_head

- name: Report the ISO
  ansible.builtin.debug:
    msg: >-
      Agent ISO published at {{ ignition_base_url }}/{{ sno_iso_name }}
      ({{ (sno_iso_head.content_length | int / 1024 / 1024) | round | int }} MiB)
