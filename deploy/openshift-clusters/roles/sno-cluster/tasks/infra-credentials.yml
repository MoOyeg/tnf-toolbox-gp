---
# Give the ACM cluster a kubeconfig for TNF, so HyperShift running on ACM can
# create KubeVirt VMs over on TNF, across the peering connection.
#
# This is what "ACM separate from the hosting cluster" reduces to: the
# HostedCluster lives on the ACM cluster, its VMs live on TNF, and this secret is
# the only thing joining them. hcp references it with --infra-kubeconfig-file.
#
# op_kubeconfig is the ACM cluster here; the TNF kubeconfig is the payload.
#
# These tasks run on the ACM bastion, which has no copy of TNF's kubeconfig --
# that file is produced by, and stays on, the TNF bastion. So it is read there
# and written here before anything tries to use it.

- name: Read the TNF cluster's kubeconfig from the TNF bastion
  ansible.builtin.slurp:
    src: "{{ kubeconfig }}"
  delegate_to: "{{ groups['bastion'][0] }}"
  register: tnf_kubeconfig_raw

- name: Write the TNF kubeconfig to the ACM bastion for hcp to reference
  ansible.builtin.copy:
    content: "{{ tnf_kubeconfig_raw.content | b64decode }}"
    dest: "{{ acm_install_dir }}/infra-kubeconfig"
    mode: '0600'

- name: Create the namespace the ACM cluster creates hosted clusters in
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ hcp_namespace }}"

- name: Store the TNF kubeconfig on the ACM cluster as the infra credential
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ infra_kubeconfig_secret }}"
        namespace: "{{ hcp_namespace }}"
      type: Opaque
      data:
        kubeconfig: "{{ tnf_kubeconfig_raw.content }}"

# TNF's own MCE also hosts clusters, in its own 'clusters' namespace. Keeping the
# ACM hub's VMs somewhere else is what stops two HyperShift operators reconciling
# the same objects -- they would both believe they own them.
- name: Create the infra namespace on TNF for VMs the ACM cluster creates
  kubernetes.core.k8s:
    kubeconfig: "{{ acm_install_dir }}/infra-kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ acm_infra_namespace }}"
        labels:
          tnf-toolbox-gp/owner: acm-site

# Proves the ACM site can actually reach TNF's API across the peering connection,
# rather than merely holding a file that claims to. A credential that does not
# work fails much later, inside HyperShift, as a VM that never appears.
- name: Confirm the stored credential reaches TNF across the peering
  ansible.builtin.command: >-
    oc --request-timeout=20s --kubeconfig {{ acm_install_dir }}/infra-kubeconfig
    get namespace {{ acm_infra_namespace }} -o jsonpath='{.metadata.name}'
  register: infra_reachable
  changed_when: false
  failed_when: infra_reachable.stdout != acm_infra_namespace

- name: Report the wiring
  ansible.builtin.debug:
    msg:
      - "ACM hub: api.{{ acm_cluster_name }}.{{ base_domain }} (ACM site)"
      - "Infra cluster: TNF, namespace {{ acm_infra_namespace }}"
      - "Guest cluster VMs created from ACM run on TNF, with GPUs from it."
