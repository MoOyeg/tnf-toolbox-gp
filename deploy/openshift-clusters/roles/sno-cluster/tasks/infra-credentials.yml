---
# Give the SNO a kubeconfig for TNF, so HyperShift running on the SNO can create
# KubeVirt VMs over on TNF.
#
# This is what "ACM separate from the hosting cluster" actually reduces to: the
# HostedCluster lives on the SNO, its VMs live on TNF, and this secret is the
# only thing joining them. hcp references it with --infra-kubeconfig-file.
#
# op_kubeconfig is the SNO here; the TNF kubeconfig is the payload.

- name: Read the TNF cluster's kubeconfig
  ansible.builtin.slurp:
    src: "{{ kubeconfig }}"
  register: tnf_kubeconfig_raw

- name: Create the namespace the SNO creates hosted clusters in
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ hcp_namespace }}"

- name: Store the TNF kubeconfig on the SNO as the infra cluster credential
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ infra_kubeconfig_secret }}"
        namespace: "{{ hcp_namespace }}"
      type: Opaque
      data:
        kubeconfig: "{{ tnf_kubeconfig_raw.content }}"

# TNF's own MCE also hosts clusters, in its own 'clusters' namespace. Keeping the
# SNO's VMs somewhere else is what stops two HyperShift operators reconciling the
# same objects -- they would both believe they own them.
- name: Create the infra namespace on TNF for VMs the SNO creates
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ sno_infra_namespace }}"
        labels:
          tnf-toolbox-gp/owner: sno-acm

- name: Write the TNF kubeconfig to the bastion for hcp to reference
  ansible.builtin.copy:
    src: "{{ kubeconfig }}"
    dest: "{{ sno_install_dir }}/infra-kubeconfig"
    remote_src: true
    mode: '0600'

# Proves the SNO can actually reach TNF's API, rather than merely holding a file
# that claims to. A credential that does not work fails much later, inside
# HyperShift, as a VM that never appears.
- name: Confirm the stored credential can reach TNF
  ansible.builtin.command: >-
    oc --request-timeout=20s --kubeconfig {{ sno_install_dir }}/infra-kubeconfig
    get namespace {{ sno_infra_namespace }} -o jsonpath='{.metadata.name}'
  register: infra_reachable
  changed_when: false
  failed_when: infra_reachable.stdout != sno_infra_namespace

- name: Report the wiring
  ansible.builtin.debug:
    msg:
      - "ACM hub: the SNO at api.{{ sno_cluster_name }}.{{ base_domain }}"
      - "Infra cluster: TNF, namespace {{ sno_infra_namespace }}"
      - "Guest cluster VMs created from the SNO will run on TNF, with GPUs from it."
