---
# Raise the ACM hub's pod ceiling.
#
# The kubelet's default is 250 pods per node. A single-node hub carrying ACM,
# MultiCluster Engine, OpenShift Virtualization and one hosted control plane per
# guest cluster went past that with room to spare on every other axis -- the
# node was at 279 pods wanted against 250 allowed, with 47 of 48 cores and 187
# GiB of memory free. The second guest cluster's control plane simply never
# scheduled:
#
#   0/1 nodes are available: 1 Too many pods.
#
# Nothing about that message points at a per-node cap rather than at capacity,
# which is why it is worth setting deliberately rather than discovering twice.
#
# The hosted control planes and OpenShift Virtualization have since moved to
# TNF, so the hub no longer comes near the default. This stays as headroom: it
# costs nothing, and the ceiling is the kind of thing that is invisible until
# something is already failing against it for reasons that look unrelated.

- name: Raise the maximum pods per node on the ACM hub
  kubernetes.core.k8s:
    kubeconfig: "{{ acm_kubeconfig }}"
    state: present
    definition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: KubeletConfig
      metadata:
        name: acm-hub-max-pods
      spec:
        machineConfigPoolSelector:
          matchLabels:
            pools.operator.machineconfiguration.openshift.io/master: ""
        kubeletConfig:
          maxPods: "{{ acm_max_pods }}"
  register: max_pods

# The MCO reboots the node to apply it, and on a single-node cluster that takes
# the API with it for as long as the machine takes to come back. That was ten
# minutes and more when this node was bare metal and had a POST to get through;
# an ordinary instance is quicker, but the API still goes away entirely.
#
# Waiting on the MachineConfigPool is the obvious thing and it is wrong here: the
# pool is asked immediately after the KubeletConfig is created, before the MCO
# has noticed it, so it still reads the previous settled state and the wait
# satisfies instantly. The play then walks straight into the reboot it was
# supposed to wait out.
#
# So the wait is on the end state itself -- the node offering the pods that were
# asked for. That cannot be true early: it is only true once the node has
# rebooted, come back, and rejoined with the new kubelet configuration. Failures
# are tolerated throughout, because for most of that window there is no API to
# answer at all.
- name: Wait for the node to come back offering the raised pod count
  ansible.builtin.command: >-
    oc get node {{ acm_sno_node_name }}
    -o jsonpath='{.status.allocatable.pods}'
  environment:
    KUBECONFIG: "{{ acm_kubeconfig }}"
  register: acm_allocatable_pods
  changed_when: false
  failed_when: false
  retries: "{{ (acm_pod_capacity_timeout | int / 30) | int }}"
  delay: 30
  until: acm_allocatable_pods.stdout | default('0') | int >= (acm_max_pods | int)

- name: Fail if the pod ceiling never took
  ansible.builtin.assert:
    that: acm_allocatable_pods.stdout | default('0') | int >= (acm_max_pods | int)
    fail_msg: >-
      {{ acm_sno_node_name }} still offers
      {{ acm_allocatable_pods.stdout | default('unknown') }} pods after
      {{ acm_pod_capacity_timeout }}s, not the {{ acm_max_pods }} asked for.
      'oc get mcp master' and 'oc describe node {{ acm_sno_node_name }}' show
      whether the rollout is stuck or the node simply has not returned.

# Only now, when the node is back and answering: a pool left Degraded by the
# rollout is a real problem, but it cannot be read while the API is down.
- name: Confirm the rollout left the pool healthy
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get mcp master --no-headers | awk '{print $3, $4, $5}'
  environment:
    KUBECONFIG: "{{ acm_kubeconfig }}"
  register: acm_mcp
  changed_when: false
  failed_when: false
  retries: "{{ (mcp_rollout_timeout | int / 30) | int }}"
  delay: 30
  until: acm_mcp.stdout == "True False False"

- name: Report the pod ceiling
  ansible.builtin.debug:
    msg: "ACM hub allows {{ acm_allocatable_pods.stdout }} pods per node."
