---
# Wait for the ACM cluster to install, then tidy up its bootstrap machine.

- name: Wait for bootstrap-complete
  ansible.builtin.command: >-
    {{ bin_dir }}/openshift-install wait-for bootstrap-complete
    --dir {{ acm_install_dir }} --log-level info
  register: acm_bootstrap
  async: "{{ acm_bootstrap_timeout | int }}"
  poll: 30
  changed_when: true

- name: Destroy the ACM bootstrap machine
  ansible.builtin.command:
    cmd: "{{ repo_root }}/deploy/aws-infra/scripts/destroy-acm-bootstrap.sh"
  delegate_to: localhost
  changed_when: true

- name: Drop the bootstrap node from the ACM haproxy
  ansible.builtin.include_role:
    name: loadbalancer
  vars:
    include_bootstrap: false
    control_plane_nodes: "{{ acm_control_plane_nodes }}"

- name: Remove bootstrap.ign now that it is no longer needed
  ansible.builtin.file:
    path: "{{ ignition_root }}/bootstrap.ign"
    state: absent
  become: true

- name: Wait for install-complete
  ansible.builtin.command: >-
    {{ bin_dir }}/openshift-install wait-for install-complete
    --dir {{ acm_install_dir }} --log-level info
  register: acm_install
  async: "{{ acm_install_timeout | int }}"
  poll: 60
  changed_when: true

- name: Wait for the single node to be Ready
  ansible.builtin.command: oc get nodes --no-headers
  environment:
    KUBECONFIG: "{{ acm_kubeconfig }}"
  register: acm_nodes
  changed_when: false
  retries: 60
  delay: 20
  until:
    - acm_nodes.rc == 0
    - acm_nodes.stdout_lines | select('search', ' Ready') | list | length == 1

- name: Wait for the cluster operators to settle
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get clusteroperators --no-headers
    | awk '$3 != "True" || $5 == "True"'
  environment:
    KUBECONFIG: "{{ acm_kubeconfig }}"
  register: acm_co
  changed_when: false
  retries: 60
  delay: 30
  until: acm_co.stdout == ""

- name: Report the ACM cluster
  ansible.builtin.debug:
    msg:
      - "{{ acm_cluster_name }} is installed at the ACM site."
      - "API:     https://api.{{ acm_cluster_name }}.{{ base_domain }}:6443"
      - "Console: https://console-openshift-console.apps.{{ acm_cluster_name }}.{{ base_domain }}"
