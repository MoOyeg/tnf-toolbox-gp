---
# Create the VM on TNF and give it a reachable address.

- name: Create the namespace that holds the SNO VM
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ sno_namespace }}"

- name: Create the DataVolumes and the VirtualMachine
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'sno-vm.yml.j2') | from_yaml_all | list }}"

- name: Expose the SNO API and ingress as NodePorts
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'sno-services.yml.j2') | from_yaml_all | list }}"

# The ISO import is the slow part and the most likely to fail: it pulls ~1 GiB
# over HTTP from the bastion into a PVC.
- name: Wait for the ISO import to finish
  ansible.builtin.command: >-
    oc get datavolume {{ sno_vm_name }}-iso -n {{ sno_namespace }}
    -o jsonpath='{.status.phase}'
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: sno_iso_dv
  changed_when: false
  retries: 60
  delay: 20
  until: sno_iso_dv.stdout == "Succeeded"

- name: Wait for the VM to start running
  ansible.builtin.command: >-
    oc get vmi {{ sno_vm_name }} -n {{ sno_namespace }} -o jsonpath='{.status.phase}'
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: sno_vmi
  changed_when: false
  retries: 40
  delay: 15
  until: sno_vmi.stdout == "Running"

- name: Report the VM
  ansible.builtin.debug:
    msg: >-
      SNO VM is running in {{ sno_namespace }}; the agent installer is now
      installing OpenShift onto its root disk.
