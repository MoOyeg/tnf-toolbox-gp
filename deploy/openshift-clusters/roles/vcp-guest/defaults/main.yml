---
op_kubeconfig: ""
# Where the pull secret and the rendered guest manifests are staged. Defaults to
# the TNF install dir, because that is the bastion this normally runs from; the
# ACM site overrides it, since TNF's install dir does not exist over there.
guest_workdir: "{{ install_dir }}"
guest_kubeconfig_dir: "{{ install_root }}/guests"
guest_release_image: "quay.io/openshift-release-dev/ocp-release:{{ ocp_version }}-x86_64"
nodepool_timeout: 3600

# The wildcard the guest's API route is published on. It must belong to the
# cluster whose router actually serves that route -- the hub the hosted control
# plane runs on -- which is the ACM cluster, not TNF, when ACM is the hub.
# Publishing api-<guest>.apps.<TNF domain> on the ACM hub creates a route its
# router never answers for, and the control plane sits at
# InfrastructureReady=False forever with no kube-apiserver.
#
# Not named cluster_domain: that is an extra var, and extra vars outrank
# include_role parameters, so a caller's override would be silently discarded.
guest_api_domain: "{{ cluster_domain }}"
