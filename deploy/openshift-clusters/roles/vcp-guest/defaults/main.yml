---
op_kubeconfig: ""
# Where the pull secret and the rendered guest manifests are staged. Defaults to
# the TNF install dir, because that is the bastion this normally runs from; the
# ACM site overrides it, since TNF's install dir does not exist over there.
guest_workdir: "{{ install_dir }}"
guest_kubeconfig_dir: "{{ install_root }}/guests"
guest_release_image: "quay.io/openshift-release-dev/ocp-release:{{ ocp_version }}-x86_64"
nodepool_timeout: 3600

# The node address the guest's control-plane services are published on. It must
# be a node of the cluster hosting the control plane, reachable from the guest's
# worker VMs -- which run on TNF while the control plane runs on the ACM hub, so
# they reach it across the VPC peering.
#
# Deliberately not named after an extra var: extra vars outrank include_role
# parameters, so a caller's override would be silently discarded.
guest_api_address: "{{ master0_private_ip }}"

# hcp defaults the control plane to HighlyAvailable, which runs etcd as a
# three-replica StatefulSet with anti-affinity across three nodes. Neither hub
# here has three: the ACM hub is a single node and TNF is a pair. etcd-1 and
# etcd-2 stay Pending with their PVCs unbound, etcd-0 crashloops because it can
# never reach quorum, and the hosted control plane never comes up.
guest_control_plane_availability: SingleReplica
# Likewise inside the guest, which has one worker VM.
guest_infra_availability: SingleReplica
