---
# A whole OpenShift cluster on virtual machines: control-plane VMs as well as
# worker VMs. Nothing of it runs on the hub.
op_kubeconfig: ""

# The cluster's name, and so its namespace on the hub, its VM names and its
# domain. Singular rather than a count: a standalone cluster is a much bigger
# object than a hosted one -- three control-plane VMs of its own before a single
# workload -- so they are built one at a time and named deliberately.
vcp_cluster_name: vcp-1

# Where the VMs are created. The hub installs the cluster; the infra cluster
# runs every node of it.
vcp_infra_kubeconfig: ""

# Central Infrastructure Management, the assisted-installer service ACM uses to
# build standalone clusters. It is off by default in MultiCluster Engine.
cim_namespace: multicluster-engine
cim_database_storage: 20Gi
cim_filesystem_storage: 20Gi
cim_image_storage: 50Gi

# Three control-plane nodes carrying their own etcd quorum -- unlike a hosted
# cluster, whose etcd is pods on the hub. Three is the number the quorum needs
# and the number the infra cluster can split unevenly but never wholly: two
# nodes cannot hold three masters without one of them holding exactly one.
#
# Three is the fleet's shape for a guest cluster either way. A hosted guest also
# has three nodes; they are simply all workers there, since its control plane is
# pods on the hub rather than nodes of its own.
vcp_control_plane_replicas: 3
# Two workers, which makes five machines. The control plane is the part whose
# placement is constrained -- maxSkew 1 with DoNotSchedule over two infra nodes
# admits only a 2/1 split, so no infra node ever holds more than two of the
# three masters, and losing one costs a member of the quorum rather than the
# quorum. The workers spread by preference on top of that, giving 3/2.
#
# Two rather than one also puts the cluster over the line the assisted
# installer draws at two workers: below it the installer keeps control-plane
# nodes worker-labelled and runs the routers there, which is why expose.yml
# selects on the count rather than on a worker merely existing.
vcp_worker_replicas: 2

# Assisted installer minimums are 4 vCPU / 16 GiB for a control-plane node and
# 2 / 8 for a worker. These sit above them: the installer validates against free
# memory at discovery time, and a node exactly at the minimum fails that check.
# Sized for both jobs at once. These nodes are the control plane *and* the only
# place a workload can land, so the old split -- 20Gi for a control-plane node
# that ran nothing, 24Gi for a worker that did -- does not apply. 32Gi matches
# GUEST_VM_MEMORY, so both kinds of guest node are the same size.
vcp_cp_cores: 10
vcp_cp_memory: 32Gi
# The same size as a control-plane node. At two workers the assisted installer
# stops forcing the control-plane nodes schedulable, so these are where the
# routers run -- but not the only place a workload can land, because the
# AgentClusterInstall sets mastersSchedulable itself rather than leaving it to
# that rule. Each carries its share of the app, and a GPU like every other node.
vcp_worker_cores: 10
vcp_worker_memory: 32Gi
# 64Gi was too small and evicted builds: a worker carries ~25GiB of platform
# images before the app arrives, and the app adds a 6.6GiB analyzer, a 12.2GiB
# vLLM and roughly 20GiB of transient space while the analyzer image is built.
# The volumes are thin-provisioned (lvms thin-pool-1, overprovision 10), so the
# ceiling costs nothing until it is written into.
vcp_root_disk: 180Gi

# A second disk per node, for LVM Storage to build a storage class on.
#
# Without it the cluster has no storage class at all: the image registry stays
# Removed, nothing can claim a PVC, and a workload that wants one sits Pending
# with nothing saying why. The root disk cannot serve -- LVM needs a whole
# unpartitioned device, and that one is the installed system.
vcp_data_disk: 100Gi

# Where that disk appears inside the guest. virtio devices are named in
# attachment order, so the second disk of every node is the same path on all of
# them -- which is why one entry covers the cluster where an EBS volume id
# would need one per node.
vcp_data_device: /dev/vdb

# The internal registry's volume. Named and sized here because the registry
# operator cannot be left to create it: its own claim is ReadWriteMany, which
# the node-local storage class does not support. One writer, on one node.
vcp_registry_claim: image-registry-storage
vcp_registry_disk: 100Gi

# And the disk the system is installed on, named for the same reason. It has to
# be stated: both disks are eligible, and left to choose, the assisted installer
# took the *smaller* one -- the data disk. The system landed on vdb, the VM
# booted vda by its boot order, found it empty, fell through to the discovery
# ISO, and every node sat in 'pending user action' asking for the boot order to
# be fixed. approve-agents.yml sets this on each agent before the install
# starts, which is the last point it can be changed.
vcp_root_device: /dev/vda

# Per node, not per worker. In a compact cluster the control-plane nodes are
# where workloads run, so that is where the GPUs have to go -- the older split,
# which gave control-plane VMs none on the grounds that they ran nothing worth a
# T4, would now leave the cluster with no GPUs at all.
vcp_gpus_per_node: 1

vcp_agent_timeout: 1800
vcp_install_timeout: 5400

# The guest's own internal ranges. Deliberately not the infra cluster's: its
# nodes are pods on that cluster's network, and overlapping the two makes the
# guest's service traffic indistinguishable from the host's.
vcp_cluster_network_cidr: 10.132.0.0/14
vcp_service_network_cidr: 172.31.0.0/16

# Where the nodes themselves live: a layer2 user-defined network on the infra
# cluster, which is what gives each VM an address of its own.
#
# Masquerade gave every VM the identical 10.0.2.2 -- the fixed guest side of
# KubeVirt's NAT -- so three agents registered as three copies of one host and
# no cluster could form from them. A primary UDN hands each VM a real address
# out of this range, and ipam.lifecycle Persistent keeps it across a reboot,
# which is the part bridge binding on the pod network could not do: there the
# address is the pod's, and it changes whenever the VM is recreated, taking
# etcd's peer URLs and the serving certificates with it.
#
# Chosen against everything already allocated: the infra cluster's pod and
# service networks (10.128.0.0/14, 172.30.0.0/16), this guest's own
# (10.132.0.0/14, 172.31.0.0/16), and both VPCs (10.0.0.0/16, 10.1.0.0/16).
vcp_node_network_cidr: 10.200.0.0/16
vcp_node_network_name: vcp-nodes

# Where this site's policy and the objects that place it live. Deliberately not
# the site namespace: that name is also a ManagedCluster, and ACM's propagator
# deletes any root policy it finds in a cluster's namespace.
vcp_policy_namespace: "{{ vcp_cluster_name }}-policies"

# Where this cluster's own kubeconfig is once it has been harvested. Absent
# until the cluster is installed, which is why every task that uses it checks
# first -- the same shape as approving agents and publishing DNS, both of which
# do nothing useful on the run that first writes the site.
vcp_guest_kubeconfig: "{{ guest_kubeconfig_dir }}/{{ vcp_cluster_name }}.kubeconfig"
