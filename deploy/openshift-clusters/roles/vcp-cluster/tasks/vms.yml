---
# The virtual machines, created on the infra cluster.
#
# Every node of this cluster is a VM here -- control plane included, which is
# the whole difference from the hosted variant. They boot the hub's discovery
# ISO over the peering connection and register themselves as Agents.

- name: Create the VM namespace on the infra cluster
  ansible.builtin.include_tasks: vm-namespace.yml

- name: Import the discovery ISO
  ansible.builtin.include_tasks: discovery-iso.yml
  vars:
    discovery_iso_url: "{{ iso_url.stdout }}"

# No wait for the import here, and that is not an omission.
#
# The storage class binds WaitForFirstConsumer, so a discovery volume does not
# begin importing until something consumes it -- and the only consumer is the
# virtual machine created below. Waiting for the volumes first is therefore a
# deadlock: they sit in PendingPopulation forever because the thing that would
# populate them is what the wait is blocking.
#
# WaitForFirstConsumer is also the point. The volume is provisioned on whichever
# node the scheduler picks for the VM, so placement is decided by the spread
# constraints and the storage follows. Forcing the import up front -- an
# immediate-binding annotation -- would invert that: TopoLVM would pick a node
# for the volume and the VM would be pinned to it, which is the failure the
# per-machine volumes were introduced to remove.
#
# The wait that matters is the one below, which is satisfied only once each
# machine's volume has imported and attached.
- name: Create the cluster's virtual machines
  kubernetes.core.k8s:
    kubeconfig: "{{ vcp_infra_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'virtualmachine.yaml.j2') | from_yaml }}"
  loop: "{{ vcp_nodes }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }} ({{ vm.role }})"

- name: Wait for every VM to be running
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get vmi -n {{ vcp_vm_namespace }} --no-headers 2>/dev/null
    | grep -c ' Running '
  environment:
    KUBECONFIG: "{{ vcp_infra_kubeconfig }}"
  register: vmi_running
  changed_when: false
  failed_when: false
  # Thirty minutes, not twenty. This wait now covers one ISO import per machine
  # rather than one for the cluster, and they cross the peering connection
  # together -- the same bytes as before multiplied by the machine count, on a
  # link that is shared with everything else between the two sites.
  retries: 90
  delay: 20
  until: vmi_running.stdout | trim | int == vcp_nodes | length

- name: Report the virtual machines
  ansible.builtin.debug:
    msg: >-
      {{ vcp_nodes | length }} VMs running on the infra cluster:
      {{ vcp_control_plane_replicas }} control plane, {{ vcp_worker_replicas }} workers
      ({{ vcp_nodes | length }} nodes, {{ vcp_gpus_per_node }} GPU(s) each).
