---
# Write this cluster's site definition into the fleet repository, and put the
# secrets it references on the hub.
#
# The split is deliberate and is the one thing about this layout worth getting
# right: the ClusterInstance goes to Git, where Argo CD syncs it and repairs
# drift; the pull secret does not. A Secret in a Git repository is readable by
# everyone who can read the repository, and this one carries registry
# credentials. So Ansible puts it straight on the hub and Git never sees it.

# An empty kubeconfig is not an error to the k8s module -- it falls back to the
# environment, which in this play is the hub. That is how the discovery ISO for
# a cluster whose VMs run on the infra cluster was imported onto the hub
# instead: no failure, no warning, just a DataVolume on the wrong cluster and
# three VMs waiting for a PVC that would never appear.
- name: Refuse to guess which cluster the virtual machines belong on
  ansible.builtin.assert:
    that: vcp_infra_kubeconfig | default('') | length > 0
    fail_msg: >-
      vcp_infra_kubeconfig is empty. The virtual machines and their discovery
      ISO belong on the infra cluster, and without this the module would put
      them wherever KUBECONFIG happens to point -- which is the hub.

- name: Plan the cluster's virtual machines
  ansible.builtin.include_tasks: plan-nodes.yml

- name: Create the site namespace on the hub
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ vcp_cluster_name }}"
        labels:
          cluster.open-cluster-management.io/backup: cluster-activation

# Created before the ClusterInstance is synced rather than after: the operator's
# validator refuses to render anything while the referenced pull secret is
# missing, and Argo CD would show the site permanently degraded.
- name: Put the pull secret in the site namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ vcp_cluster_name }}-pull-secret"
        namespace: "{{ vcp_cluster_name }}"
      type: kubernetes.io/dockerconfigjson
      # Built as one expression, because pull_secret is JSON text and Ansible
      # converts a templated value that looks like a literal back into one. Set
      # as `.dockerconfigjson: "{{ pull_secret }}"` it arrives as an object and
      # the API server rejects the Secret; wrapped, the conversion produces the
      # mapping and the value inside it stays a string.
      stringData: "{{ {'.dockerconfigjson': pull_secret} }}"
  no_log: true

# Required only because the operator's validator walks spec.nodes and refuses to
# render anything while a node's bmcCredentialsName names a Secret that is not
# there. Nothing reads it: the node template set renders no BareMetalHost, so
# there is no Ironic to hand it to. It carries no real credential for the same
# reason -- inventing one that worked would be worse than one that plainly does
# not.
- name: Satisfy the validator's check for BMC credentials
  kubernetes.core.k8s:
    kubeconfig: "{{ op_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ vcp_cluster_name }}-bmc-placeholder"
        namespace: "{{ vcp_cluster_name }}"
      type: Opaque
      stringData:
        username: unused
        password: unused

- name: Create the site folder
  ansible.builtin.file:
    path: "{{ site_repo_dir }}/{{ vcp_cluster_name }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Write the site definition
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ site_repo_dir }}/{{ vcp_cluster_name }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - {src: site-namespace.yaml.j2, dest: namespace.yaml}
    - {src: clusterinstance.yaml.j2, dest: clusterinstance.yaml}
    - {src: extra-manifests.yaml.j2, dest: extra-manifests.yaml}
    - {src: policy-virtualmachines.yaml.j2, dest: policy-virtualmachines.yaml}
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: localhost

- name: Create the infra half of the site folder
  ansible.builtin.file:
    path: "{{ site_infra_repo_dir }}/{{ vcp_cluster_name }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

# Only the namespace now. The virtual machines, the DataVolume they boot and the
# CA that verifies it are all created by the Policy written above, which resolves
# the ISO URL and the GPU device name when it enforces rather than when this
# renders -- neither is knowable here.
- name: Write the namespace Argo CD places on the infra cluster
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ site_infra_repo_dir }}/{{ vcp_cluster_name }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - {src: sites-infra-namespace.yaml.j2, dest: namespace.yaml}
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: localhost

# The Policy creates the DataVolume and the machines, but not the namespace they
# go in -- a ConfigurationPolicy creates namespaced objects, not the namespace.
# Argo CD syncs it too, from sites-infra/; creating it here as well means the
# Policy can enforce without waiting on that Application, and Argo re-asserting
# it afterwards is a no-op.
#
# Unconditional now. It used to be gated on the discovery ISO existing, because
# the only reason to have the namespace early was to put a DataVolume in it; the
# Policy resolves that URL itself, so there is nothing left here to wait for.
- name: Create the VM namespace on the infra cluster
  ansible.builtin.include_tasks: vm-namespace.yml

- name: Say where the virtual machines come from now
  ansible.builtin.debug:
    msg: >-
      {{ vcp_cluster_name }}'s machines are created by the
      {{ vcp_cluster_name }}-virtual-machines Policy once its ClusterInstance is
      synced and the InfraEnv has an ISO. Nothing to re-run: the policy resolves
      the ISO URL and the GPU device name itself, and enforces when they appear.

# The machines are created by Argo CD from the manifests written above, boot the
# discovery ISO, and register themselves -- and then wait to be approved, which
# nothing in this path did until now. Tolerant of there being none yet: on the
# run that first writes a site there is not even a ClusterInstance, let alone a
# booted machine. Running the stage again once they have registered approves
# them, in the same way it harvests a kubeconfig that did not exist before.
- name: Approve any machines that have registered for this cluster
  ansible.builtin.include_tasks: approve-agents.yml

# Only once the machines have addresses to publish. On the run that first writes
# a site there are none, and this stage is re-run until there are -- the same
# shape as approving the agents above and harvesting the kubeconfig later.
- name: Publish the cluster's DNS once its machines have addresses
  ansible.builtin.include_tasks: dns.yml
  when: vcp_agents.stdout_lines | default([]) | select | list | length > 0

# Only once the machines have addresses, for the same reason the DNS does: the
# Services select the VMs by label and have nothing to point at before they are
# running.
#
# Shared with the direct path rather than left to it. With user-managed
# networking the installer builds no VIPs, so nothing publishes the API or the
# ingress -- and the nodes' own addresses are on a user-defined network that
# only the infra cluster can route. A cluster built from Git without this is
# installed, healthy and unreachable: not from a workstation, not from the ACM
# bastion, which is where the klusterlet is installed from, so it cannot even
# be imported into the hub.
- name: Publish the cluster's API and ingress
  ansible.builtin.include_tasks: expose.yml
  when: vcp_agents.stdout_lines | default([]) | select | list | length > 0

- name: Report what to commit
  ansible.builtin.debug:
    msg:
      - "{{ vcp_cluster_name }}: hub half written to {{ site_repo_dir }}/{{ vcp_cluster_name }}/"
      - "{{ vcp_cluster_name }}: infra half written to {{ site_infra_repo_dir }}/{{ vcp_cluster_name }}/"
      - "Commit and push it. Argo CD builds the cluster from Git, not from this run."
