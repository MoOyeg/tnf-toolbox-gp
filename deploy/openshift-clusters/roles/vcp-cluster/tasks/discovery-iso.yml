---
# Import the hub's discovery ISO onto the infra cluster, with something CDI can
# verify the hub against.
#
# Used by the stage that builds an all-VM cluster directly. The GitOps stage
# creates the same objects from its Policy instead, because the ISO's URL is a
# credential that must not be committed and is resolved when the policy
# enforces rather than when the site is written.
#
# certConfigMap was previously set to "", which reads as "no certificate to
# worry about" and means nothing of the kind: CDI still verifies, now against
# the system roots, and the hub's image service presents an ingress certificate
# signed by the cluster's own CA. The import fails with
#
#   x509: certificate signed by unknown authority
#
# and the virtual machines sit in DataVolumeError waiting for a PVC that never
# populates. So the hub's ingress CA is copied across and named here.
#
# Caller supplies discovery_iso_url.

- name: Read the hub's ingress CA
  ansible.builtin.command: >-
    oc get configmap default-ingress-cert -n openshift-config-managed
    -o jsonpath='{.data.ca-bundle\.crt}'
  environment:
    KUBECONFIG: "{{ op_kubeconfig }}"
  register: hub_ingress_ca
  changed_when: false

- name: Fail if the hub has no ingress CA to trust
  ansible.builtin.assert:
    that: hub_ingress_ca.stdout | length > 0
    fail_msg: >-
      default-ingress-cert in openshift-config-managed is empty on the hub.
      Without it CDI cannot verify the image service and the discovery ISO
      import fails with "certificate signed by unknown authority".

- name: Give the infra cluster the hub's CA to verify against
  kubernetes.core.k8s:
    kubeconfig: "{{ vcp_infra_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ vcp_cluster_name }}-hub-ca"
        namespace: "{{ vcp_vm_namespace }}"
      data: "{{ {'ca.pem': hub_ingress_ca.stdout} }}"

# One import per machine, not one shared by the cluster.
#
# Sharing it is the cheaper answer and it was the wrong one. The volume is
# ReadWriteOnce on storage that is node-local, so a shared one is a hard
# scheduling constraint that pins every machine to whichever infra node
# holds it -- and a topology spread constraint, being at best a preference over
# a hard one, cannot win against it. Three machines then sat on one infra node,
# and losing that node lost the whole cluster rather than one member of three.
#
# The cost is real and is the whole cost: CDI pulls the same ISO once per
# machine across the peering connection instead of once. That buys placement
# the scheduler is free to choose, which is the only thing that makes the
# spread constraints in virtualmachine.yaml.j2 mean anything.
- name: Import the discovery ISO, one volume per machine
  kubernetes.core.k8s:
    kubeconfig: "{{ vcp_infra_kubeconfig }}"
    state: present
    definition:
      apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: "{{ item.name }}-discovery"
        namespace: "{{ vcp_vm_namespace }}"
      spec:
        source:
          http:
            url: "{{ discovery_iso_url }}"
            certConfigMap: "{{ vcp_cluster_name }}-hub-ca"
        storage:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 8Gi
          storageClassName: "{{ storage_class }}"
  loop: "{{ vcp_nodes }}"
  loop_control:
    label: "{{ item.name }}-discovery"
