---
# A standalone OpenShift cluster whose every node is a virtual machine.
#
# The difference from hcp-guest is where the control plane lives. A hosted
# cluster's control plane is pods on the hub, and only its workers are VMs; this
# one has control-plane VMs of its own carrying their own etcd quorum, and the
# hub keeps nothing afterwards but the records that installed it.
#
# It is also a different mechanism. HyperShift does not come into it: ACM builds
# this with the assisted installer, so the VMs boot a discovery ISO, register
# themselves as Agents, and are installed exactly the way bare metal would be.
# The virtual machines are simply the hardware.

# Built as YAML and parsed back, rather than assembled with filters. The name
# carries the role -- the approval step reads it back out of the hostname -- so
# it is worth being able to see the names.
- name: Plan the cluster's virtual machines
  ansible.builtin.set_fact:
    vcp_nodes: "{{ vcp_node_plan | from_yaml }}"
  vars:
    vcp_node_plan: |
      {% for i in range(1, vcp_control_plane_replicas | int + 1) %}
      - name: {{ vcp_cluster_name }}-cp-{{ i }}
        role: control-plane
        cores: {{ vcp_cp_cores }}
        memory: {{ vcp_cp_memory }}
        gpus: 0
      {% endfor %}
      {% for i in range(1, vcp_worker_replicas | int + 1) %}
      - name: {{ vcp_cluster_name }}-worker-{{ i }}
        role: worker
        cores: {{ vcp_worker_cores }}
        memory: {{ vcp_worker_memory }}
        gpus: {{ vcp_gpus_per_worker }}
      {% endfor %}

- name: Check the workers' GPUs fit what the infra cluster has
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get nodes -o json
    | jq --arg r "{{ gpu_resource_name }}"
    '[.items[].status.allocatable[$r] // "0" | tonumber] | add'
  environment:
    KUBECONFIG: "{{ vcp_infra_kubeconfig }}"
  register: vcp_gpu_supply
  changed_when: false
  when: vcp_gpus_per_worker | int > 0

- name: Fail if the cluster would need more GPUs than exist
  ansible.builtin.assert:
    that: >-
      (vcp_worker_replicas | int * vcp_gpus_per_worker | int)
      <= (vcp_gpu_supply.stdout | trim | int)
    fail_msg: >-
      {{ vcp_worker_replicas }} workers x {{ vcp_gpus_per_worker }} GPUs needs
      {{ vcp_worker_replicas | int * vcp_gpus_per_worker | int }}
      {{ gpu_resource_name }}, and the infra cluster offers
      {{ vcp_gpu_supply.stdout | trim }}.
  when: vcp_gpus_per_worker | int > 0

- name: Enable Central Infrastructure Management on the hub
  ansible.builtin.include_tasks: cim.yml

- name: Create the discovery ISO
  ansible.builtin.include_tasks: infraenv.yml

- name: Create the virtual machines
  ansible.builtin.include_tasks: vms.yml

- name: Install the cluster onto them
  ansible.builtin.include_tasks: install.yml

- name: Publish the cluster's API and ingress
  ansible.builtin.include_tasks: expose.yml
