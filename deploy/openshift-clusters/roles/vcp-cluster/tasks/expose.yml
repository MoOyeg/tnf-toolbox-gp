---
# Make the cluster reachable.
#
# With user-managed networking the installer builds no VIPs, so something has to
# publish the API and ingress. The VMs are pods on the infra cluster, so a
# Service selecting them is the natural handle -- NodePort rather than
# LoadBalancer, for the same reason everything else here is: nothing in a VPC
# provisions a LoadBalancer on platform:none.
#
# NodePorts alone answer only inside TNF's VPC: the nodes are on a user-defined
# network nothing else routes to, and the cluster's DNS zone is private to that
# VPC. So they are fronted with a public load balancer, created right here, and
# that is the one way in for everything outside TNF -- a workstation, and the
# hub itself, which finishes the cluster through it further down.

- name: Publish the control-plane API
  kubernetes.core.k8s:
    kubeconfig: "{{ vcp_infra_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ vcp_cluster_name }}-api"
        namespace: "{{ vcp_vm_namespace }}"
      spec:
        type: NodePort
        selector:
          tnf-toolbox-gp/cluster: "{{ vcp_cluster_name }}"
          tnf-toolbox-gp/role: control-plane
        ports:
          - name: api
            port: 6443
            targetPort: 6443
            protocol: TCP

- name: Publish the ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ vcp_infra_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ vcp_cluster_name }}-ingress"
        namespace: "{{ vcp_vm_namespace }}"
      spec:
        type: NodePort
        # Wherever the router actually runs, which is not simply "the workers".
        # The assisted installer keeps the control-plane nodes schedulable, and
        # worker-labelled, while there are fewer than two workers -- so with one
        # worker the routers still run on the control-plane machines, and this
        # follows that rule rather than the presence of any worker at all. Selecting workers unconditionally left this Service with
        # no endpoints on the default topology: a NodePort listening with
        # nothing behind it, which refuses connections rather than failing in a
        # way that names the cause.
        selector:
          tnf-toolbox-gp/cluster: "{{ vcp_cluster_name }}"
          tnf-toolbox-gp/role: >-
            {{ 'worker' if (vcp_worker_replicas | int) >= 2 else 'control-plane' }}
        ports:
          - name: https
            port: 443
            targetPort: 443
            protocol: TCP
          - name: http
            port: 80
            targetPort: 80
            protocol: TCP

- name: Read the ports they landed on
  ansible.builtin.shell: >-
    set -o pipefail;
    oc get svc {{ vcp_cluster_name }}-api {{ vcp_cluster_name }}-ingress
    -n {{ vcp_vm_namespace }} -o json
    | jq -r '.items[] | "\(.metadata.name) \(.spec.ports[].nodePort)"'
  environment:
    KUBECONFIG: "{{ vcp_infra_kubeconfig }}"
  register: vcp_nodeports
  changed_when: false

# As soon as the ports exist, which on the Git path is the run that approves
# the agents -- forty minutes before the cluster is installed. That timing is
# the point: the public names are in place long before anyone looks them up,
# and a name looked up before its record exists is cached as nonexistent for a
# quarter of an hour. This used to be a separate 'make vcp-lb', which nothing
# ran and the README did not mention, so the cluster installed and was
# unreachable from everywhere but TNF.
#
# delegate_to: localhost for the same reason as the DNS: the AWS credentials
# are on the control host, and the bastions' instance profiles are scoped to
# far less than creating a load balancer.
- name: "{{ vcp_cluster_name }}: put a public load balancer in front of them"
  ansible.builtin.command:
    argv:
      - "{{ repo_root }}/deploy/aws-infra/scripts/create-vcp-lb.sh"
      - "{{ vcp_cluster_name }}"
  delegate_to: localhost
  register: vcp_public_lb
  changed_when: "'already up to date' not in vcp_public_lb.stdout"

- name: "{{ vcp_cluster_name }}: report how to reach it"
  ansible.builtin.debug:
    # The URLs picked out rather than the lines cleaned up: the script colours
    # its output unconditionally, and a character class that cannot match the
    # escape byte ends each match before the colour code without needing one.
    msg: "{{ vcp_public_lb.stdout | regex_findall('https://[-.:a-z0-9]+') }}"

# One router per node the ingress Service selects.
#
# The Service selects every node of the cluster, and kube-proxy forwards to any
# of them -- but the default IngressController runs two replicas, so on a
# three-node cluster one node has no router and refuses the connection. The load
# balancer's health check does not catch it: it is a TCP check against the
# NodePort, which kube-proxy opens on every node whether or not a router is
# behind it. The symptom is a console that works about two times in three, which
# reads as flakiness rather than as a replica count.
# Read from the hub rather than from a harvested file. The harvest happens
# later in the same run -- 42-sites.yml collects kubeconfigs after every site is
# written -- so a task here that waits for the file can never fire on the run
# that needs it, and silently skips instead.
- name: "{{ vcp_cluster_name }}: read its kubeconfig from the hub"
  ansible.builtin.shell: |
    set -o pipefail
    # Installed means the ClusterDeployment says so, not that the kubeconfig
    # exists. The assisted installer writes that secret when the install
    # starts, forty minutes early -- harmless while nothing outside TNF could
    # reach the cluster, but with the load balancer created on this same run
    # the bootstrap node answered readyz, and storage was installed onto a
    # cluster whose OLM did not exist yet: 404 on the OperatorGroup.
    installed=$(oc --kubeconfig {{ op_kubeconfig }} get clusterdeployment {{ vcp_cluster_name }} \
      -n {{ vcp_cluster_name }} -o jsonpath='{.spec.installed}' 2>/dev/null)
    [ "${installed}" = "true" ] || exit 0
    tmp="$(mktemp)"
    if oc --kubeconfig {{ op_kubeconfig }} get secret {{ vcp_cluster_name }}-admin-kubeconfig \
         -n {{ vcp_cluster_name }} -o jsonpath='{.data.kubeconfig}' 2>/dev/null \
         | base64 -d > "${tmp}" && [ -s "${tmp}" ]; then
      install -m 0600 "${tmp}" "{{ vcp_guest_kubeconfig }}"
      rm -f "${tmp}"
      echo present
    else
      rm -f "${tmp}"
    fi
  register: vcp_kubeconfig_read
  changed_when: false
  failed_when: false

- name: "{{ vcp_cluster_name }}: note whether it is installed yet"
  ansible.builtin.set_fact:
    vcp_kubeconfig_present: "{{ 'present' in (vcp_kubeconfig_read.stdout | default('')) }}"

# Installed is not the same as reachable from here. This runs on the hub's
# bastion, in the ACM VPC, and reaches the cluster only through the public load
# balancer created above. Before that existed the steps below failed without
# saying why: the router step skipped without a word, storage died in urllib3
# with "Name or service not known", and the import would have followed.
# Retried because the load balancer may be minutes old. A new one's targets
# take about a minute to pass their first health checks, and until they do the
# name resolves and the connection is refused.
- name: "{{ vcp_cluster_name }}: check its API answers from here"
  ansible.builtin.command: >-
    oc --kubeconfig {{ vcp_guest_kubeconfig }} get --raw /readyz --request-timeout=15s
  register: vcp_api_probe
  changed_when: false
  failed_when: false
  retries: 12
  delay: 10
  until: vcp_api_probe.stdout | default('') | trim == 'ok'
  when: vcp_kubeconfig_present | bool

- name: "{{ vcp_cluster_name }}: note whether it can be finished from here"
  ansible.builtin.set_fact:
    vcp_api_reachable: "{{ vcp_kubeconfig_present | bool and (vcp_api_probe.stdout | default('') | trim) == 'ok' }}"
    # Read by 42-sites.yml, which imports every harvested guest after this.
    vcp_guests_unreachable: >-
      {{ (vcp_guests_unreachable | default([]))
         + ([vcp_cluster_name] if (vcp_kubeconfig_present | bool
              and (vcp_api_probe.stdout | default('') | trim) != 'ok') else []) }}

- name: "{{ vcp_cluster_name }}: say what is left, and what unblocks it"
  ansible.builtin.debug:
    msg: >-
      {{ vcp_cluster_name }} is installed, but its API does not answer from the
      hub bastion through its public load balancer after two minutes
      ({{ (vcp_api_probe.stderr_lines | default(['no answer']) | last | default('no answer'))[:160] }}).
      Its routers, storage and import are left for the next run. Check the
      {{ vcp_cluster_name }}-pub-lb stack's target health, then run
      'make sites' again.
  when:
    - vcp_kubeconfig_present | bool
    - not vcp_api_reachable | bool

# The nodes a router may run on, which is not the same as every node. The
# default IngressController places routers on nodes labelled worker: on a
# cluster with no dedicated workers that is all of them, and on one with a
# worker it is only that worker. Counting every node instead asked for four
# replicas where one node could take them, leaving three Pending and the
# ingress operator Degraded.
- name: "{{ vcp_cluster_name }}: read how many nodes the ingress Service covers"
  ansible.builtin.command: >-
    oc --kubeconfig {{ vcp_guest_kubeconfig }}
    get nodes -l node-role.kubernetes.io/worker --no-headers -o name
  register: vcp_node_count
  changed_when: false
  failed_when: false
  when: vcp_api_reachable | bool

- name: "{{ vcp_cluster_name }}: run one router on each of them"
  kubernetes.core.k8s:
    kubeconfig: "{{ vcp_guest_kubeconfig }}"
    state: patched
    api_version: operator.openshift.io/v1
    kind: IngressController
    name: default
    namespace: openshift-ingress-operator
    # Built as one expression so the count stays a number. A templated scalar
    # arrives as text however it is filtered, and the IngressController CRD
    # rejects "3" where it wants 3 -- the same reason the GPU workload label is
    # built this way in roles/gpu-passthrough.
    definition: "{{ {'spec': {'replicas': vcp_node_count.stdout_lines | length}} }}"
  when:
    - vcp_api_reachable | bool
    - vcp_node_count.stdout_lines | default([]) | length > 0

# Storage, once the cluster is up.
#
# An all-VM cluster installs with no storage class at all: the image registry
# stays Removed, nothing can claim a PVC, and a workload that wants one sits
# Pending with nothing naming the cause. The second disk each node carries is
# what LVM Storage builds one on.
#
# Here rather than in a stage of its own for the same reason the DNS and the
# Services are here: it needs the cluster to exist, and this is the point in a
# re-runnable stage where that is first true.
- name: "{{ vcp_cluster_name }}: build a storage class on each node's data disk"
  ansible.builtin.include_role:
    name: lvm-storage
  vars:
    op_kubeconfig: "{{ vcp_guest_kubeconfig }}"
    # This cluster's nodes, not the infra cluster's. The role checks the device
    # on each node it is given, and the default list is the cluster Ansible
    # normally runs against -- which here is the one hosting the VMs, not the
    # one inside them.
    control_plane_nodes: "{{ vcp_nodes }}"
    # The same virtio path on every node, so one entry covers the cluster --
    # unlike an EBS volume id, which differs per node.
    lvm_devices: ["{{ vcp_data_device }}"]
  when: vcp_api_reachable | bool

# The internal registry, now that there is somewhere to put it.
#
# A cluster that installs with no storage class leaves the registry operator in
# Removed -- which reports Available, because Removed is a state it is happy to
# be in, while storing nothing. Every build in the guest then fails with
# "InvalidOutputReference: Output image could not be resolved", which reads as a
# bad image reference rather than as a registry that was never turned on. That
# is what 'make app' hit on the first all-VM cluster it was run against.
#
# Here rather than in the app role because it is a property of the cluster, not
# of the workload, and because the storage it needs is built immediately above.
#
# The claim is created here rather than left to the operator, and that is the
# part that matters. Asked for storage with an empty claim, the operator writes
# a ReadWriteMany one -- and lvms-vg1 is TopoLVM, node-local block storage that
# has no such mode, so provisioning fails with "unsupported access mode:
# MULTI_NODE_MULTI_WRITER" and the PVC sits Pending for ever.
#
# Which also fixes the replica count: one writer, so one replica and Recreate
# rather than a rolling update that would want two pods holding one volume.
- name: "{{ vcp_cluster_name }}: give the registry a volume it can actually have"
  kubernetes.core.k8s:
    kubeconfig: "{{ vcp_guest_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ vcp_registry_claim }}"
        namespace: openshift-image-registry
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "{{ storage_class }}"
        resources:
          requests:
            storage: "{{ vcp_registry_disk }}"
  when: vcp_api_reachable | bool

- name: "{{ vcp_cluster_name }}: turn the image registry on, now it has storage"
  kubernetes.core.k8s:
    kubeconfig: "{{ vcp_guest_kubeconfig }}"
    state: patched
    api_version: imageregistry.operator.openshift.io/v1
    kind: Config
    name: cluster
    definition:
      spec:
        managementState: Managed
        replicas: 1
        rolloutStrategy: Recreate
        storage:
          pvc:
            claim: "{{ vcp_registry_claim }}"
  when: vcp_api_reachable | bool

- name: "{{ vcp_cluster_name }}: wait for the registry to be serving"
  ansible.builtin.command: >-
    oc --kubeconfig {{ vcp_guest_kubeconfig }} get co image-registry
    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}-{.status.conditions[?(@.type=="Progressing")].status}'
  register: vcp_registry_up
  changed_when: false
  retries: 30
  delay: 10
  until: vcp_registry_up.stdout | trim == 'True-False'
  when: vcp_api_reachable | bool

- name: "{{ vcp_cluster_name }}: report the registry"
  ansible.builtin.debug:
    msg: >-
      {{ vcp_cluster_name }}: image registry Managed on
      {{ storage_class }}, so builds in the guest have somewhere to push.
  when: vcp_api_reachable | bool
