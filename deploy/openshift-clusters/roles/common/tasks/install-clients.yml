---
# Put oc and openshift-install on the bastion.
#
# Both run here rather than on a workstation because api-int resolves only
# inside the VPC, through the Route53 private hosted zone.

# Named explicitly rather than assumed. Several roles shell out to jq, and it
# only happens to be preinstalled on Amazon Linux 2023.
- name: Install the host packages the roles shell out to
  become: true
  ansible.builtin.dnf:
    name:
      - jq
      - tar
      - gzip
      - python3-pip
      - openssl
    state: present

# kubernetes.core.k8s executes on the target, not the controller, so the client
# library has to be importable by the bastion's interpreter. Without it every
# k8s task fails with a bare "Failed to import the required Python library",
# which is a confusing way to learn about a missing dependency four stages in.
- name: Install the Kubernetes client library for kubernetes.core
  become: true
  ansible.builtin.pip:
    name:
      - kubernetes>=24.2.0
      - PyYAML
    state: present
    extra_args: --upgrade

- name: Confirm the interpreter Ansible uses can import it
  ansible.builtin.command: "{{ ansible_python_interpreter | default('/usr/bin/python3') }} -c 'import kubernetes'"
  changed_when: false

- name: Check for an existing openshift-install of the right version
  ansible.builtin.command: "{{ bin_dir }}/openshift-install version"
  register: installer_version
  changed_when: false
  failed_when: false

- name: Download and unpack the OpenShift clients
  when: ocp_version not in (installer_version.stdout | default(''))
  become: true
  block:
    - name: Download openshift-install
      ansible.builtin.unarchive:
        src: "{{ ocp_mirror }}/{{ ocp_version }}/openshift-install-linux-{{ ocp_version }}.tar.gz"
        dest: "{{ bin_dir }}"
        remote_src: true
        include:
          - openshift-install
        mode: '0755'

    - name: Download oc
      ansible.builtin.unarchive:
        src: "{{ ocp_mirror }}/{{ ocp_version }}/openshift-client-linux-{{ ocp_version }}.tar.gz"
        dest: "{{ bin_dir }}"
        remote_src: true
        include:
          - oc
          - kubectl
        mode: '0755'

- name: Record the installed versions
  ansible.builtin.command: "{{ bin_dir }}/openshift-install version"
  register: installer_final
  changed_when: false

- name: Show the installer version
  ansible.builtin.debug:
    msg: "{{ installer_final.stdout_lines | first }}"
