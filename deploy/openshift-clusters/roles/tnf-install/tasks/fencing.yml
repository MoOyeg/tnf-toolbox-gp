---
# Adapt Pacemaker's timeouts to EC2 and confirm the stonith devices are real.
#
# On hardware, a BMC cuts power in seconds. StopInstances on a bare metal
# instance takes minutes. Pacemaker's defaults assume the former, so a fence
# that is merely slow gets recorded as a fence that failed.

- name: Wait for the TNF controller to create the stonith devices
  ansible.builtin.command: >-
    oc debug node/{{ control_plane_nodes[0].name }} --quiet --
    chroot /host pcs stonith config
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: stonith_config
  changed_when: false
  retries: 40
  delay: 30
  until:
    - stonith_config.rc == 0
    - control_plane_nodes | map(attribute='name')
      | map('regex_replace', '$', '_redfish')
      | select('in', stonith_config.stdout) | list | length == control_plane_nodes | length

- name: Raise the cluster-wide stonith timeout
  ansible.builtin.command: >-
    oc debug node/{{ control_plane_nodes[0].name }} --quiet --
    chroot /host pcs property set stonith-timeout={{ stonith_timeout }}
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: stonith_property
  changed_when: stonith_property.rc == 0

# The TNF controller owns these devices and reconciles them. pcs stonith update
# leaves options it was not given alone, so these survive a reconcile -- but if
# a device is ever recreated from scratch, re-run 'make tnf' to reapply them.
- name: Raise the per-device power timeouts
  ansible.builtin.command: >-
    oc debug node/{{ control_plane_nodes[0].name }} --quiet --
    chroot /host pcs stonith update {{ item.name }}_redfish
    power_timeout={{ stonith_power_timeout }}
    pcmk_reboot_timeout={{ stonith_reboot_timeout }}
    pcmk_off_timeout={{ stonith_power_timeout }}
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item.name }}_redfish"
  register: stonith_update
  changed_when: stonith_update.rc == 0

# The check that matters. 'pcs stonith status' reporting Started only means
# Pacemaker started the resource agent; a status action proves the agent can
# actually reach the shim and read a power state.
- name: Verify each stonith device can read its target's power state
  ansible.builtin.command: >-
    oc debug node/{{ control_plane_nodes[0].name }} --quiet --
    chroot /host pcs stonith status {{ item.name }}_redfish
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  loop: "{{ control_plane_nodes }}"
  loop_control:
    label: "{{ item.name }}_redfish"
  register: stonith_status
  changed_when: false
  failed_when: "'Started' not in stonith_status.stdout"

- name: Report the fencing configuration
  ansible.builtin.debug:
    msg:
      - "Fencing is configured through {{ fencing_base_url }}"
      - "stonith-timeout={{ stonith_timeout }}, power_timeout={{ stonith_power_timeout }}s"
      - "Expect a real fence to take 5-15 minutes: stopping a bare metal EC2"
      - "instance is minutes of work, not the seconds a BMC takes."
