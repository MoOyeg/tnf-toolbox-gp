---
# The presence of auth/kubeconfig proves nothing. `openshift-install create
# ignition-configs` writes it, so a run that failed before launching a single
# instance still leaves one behind -- and treating that as "installed" skips
# the install and then fences a cluster that does not exist.
#
# The only trustworthy signal is the cluster answering.
- name: Look for an existing kubeconfig
  ansible.builtin.stat:
    path: "{{ kubeconfig }}"
  register: existing_kubeconfig

# Retried, because one timed-out probe is not evidence that a cluster is gone.
# An API server that is restarting -- after a KubeletConfig rollout, a fencing
# event, a node reboot -- answers nothing for a while and then answers fine.
- name: Ask the cluster whether it is actually installed
  ansible.builtin.command: >-
    oc --request-timeout=15s get clusterversion version
    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: existing_clusterversion
  changed_when: false
  failed_when: false
  retries: "{{ (cluster_probe_timeout | int / 15) | int }}"
  delay: 15
  until: existing_clusterversion.rc == 0 and existing_clusterversion.stdout == 'True'
  when: existing_kubeconfig.stat.exists

- name: Record whether a working cluster is already present
  ansible.builtin.set_fact:
    cluster_already_installed: >-
      {{ existing_kubeconfig.stat.exists
         and existing_clusterversion.rc | default(1) == 0
         and existing_clusterversion.stdout | default('') == 'True' }}

# The dangerous case, and the reason this check exists at all: a kubeconfig on
# disk and an API that will not answer. That is not the same as "no cluster",
# and the difference matters because the remedy below is to wipe the install
# directory and relaunch -- which, against a cluster that is merely unreachable,
# destroys the credentials for a cluster that is still running.
#
# So it stops instead. Deleting a cluster stays something a person asks for.
- name: Refuse to reinstall over a cluster that is only unreachable
  ansible.builtin.assert:
    that: not (existing_kubeconfig.stat.exists and not cluster_already_installed)
    fail_msg: >-
      {{ kubeconfig }} exists but the cluster did not answer within
      {{ cluster_probe_timeout }}s, so this stage will not reinstall over it --
      an unreachable API is not proof that the cluster is gone. If it is still
      coming up, wait and re-run. If it is genuinely broken or was never
      launched, run 'make clean' to remove it and then re-run.

- name: Install a new TNF cluster
  when: not cluster_already_installed
  block:
    - name: Generate install-config and ignition
      ansible.builtin.include_tasks: render.yml

    - name: Launch the control plane and bootstrap nodes
      ansible.builtin.include_tasks: launch.yml

    - name: Wait for bootstrap and tear it down
      ansible.builtin.include_tasks: bootstrap.yml

    - name: Wait for the install to complete
      ansible.builtin.include_tasks: finish.yml

- name: Report an existing cluster
  when: cluster_already_installed
  ansible.builtin.debug:
    msg: >-
      {{ kubeconfig }} already exists, so the install is being skipped. Run
      'make clean' to delete the cluster and its nodes before reinstalling.

# Idempotent, and the step most likely to need re-applying after the TNF
# controller reconciles the stonith devices -- but only against a cluster that
# is actually up.
- name: Tune and verify fencing
  ansible.builtin.include_tasks: fencing.yml

# The stage does not finish until the cluster is healthy *as TNF*. Everything
# after this point assumes a two-node Pacemaker cluster that can survive losing
# a node, and nothing downstream should have to re-establish that.
- name: Verify the cluster is healthy as a two-node fencing cluster
  ansible.builtin.include_tasks: health.yml
