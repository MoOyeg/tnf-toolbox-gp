---
# Render install-config.yaml and turn it into ignition.

# Ignition has to match the install-config it came from. If a previous attempt
# left artifacts behind but never launched anything, they are regenerated from
# scratch -- otherwise a corrected install-config (a fixed fencing address, say)
# would be silently paired with the old ignition, because the `creates:` guards
# below would skip regeneration.
#
# Once the nodes exist they are already igniting against the current config, so
# it is left alone and the run resumes instead.
- name: Check whether the control-plane nodes have already been launched
  ansible.builtin.stat:
    path: "{{ repo_root }}/deploy/aws-infra/instance-data/master0_instance_id"
  delegate_to: localhost
  register: nodes_launched

- name: Discard artifacts from an attempt that never launched
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: absent
  when: not nodes_launched.stat.exists

# oc caches API discovery per server address. A rebuilt cluster reuses the same
# api.<cluster>.<domain>, so the cache from the previous cluster is served for
# its 10-minute TTL -- and it lists CRDs the new cluster does not have. That
# turned `oc get subscription` into a lookup against ACM's
# subscriptions.apps.open-cluster-management.io, which failed with a NotFound
# naming a resource nothing had asked for.
- name: Discard the oc discovery cache from any previous cluster
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube/cache"
    state: absent

- name: Create the install directory
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    mode: '0700'

- name: Render install-config.yaml
  ansible.builtin.template:
    src: install-config.yaml.j2
    dest: "{{ install_dir }}/install-config.yaml"
    mode: '0600'

# openshift-install consumes install-config.yaml in place, so keep a copy.
# Reconstructing what was actually installed is otherwise guesswork.
- name: Archive a copy of install-config.yaml
  ansible.builtin.copy:
    src: "{{ install_dir }}/install-config.yaml"
    dest: "{{ install_dir }}/install-config.yaml.bak"
    remote_src: true
    mode: '0600'

- name: Create manifests
  ansible.builtin.command: "{{ bin_dir }}/openshift-install create manifests --dir {{ install_dir }}"
  args:
    creates: "{{ install_dir }}/manifests"

# With compute.replicas 0 the installer already makes the control plane
# schedulable, but there is nowhere else for the router and every operator to
# run, so it is asserted rather than assumed.
- name: Make the control plane schedulable
  ansible.builtin.lineinfile:
    path: "{{ install_dir }}/manifests/cluster-scheduler-02-config.yml"
    regexp: '^(\s*)mastersSchedulable:'
    line: '  mastersSchedulable: true'
    backrefs: false

# Day 1 rather than day 2, deliberately. Adding these kernel arguments to a
# running two-node cluster reboots each node in turn, and a node that comes back
# is not reliably re-added to the Pacemaker pair -- the split that has cost this
# rig three clusters. Here they are part of the first rendered MachineConfig, so
# both nodes boot with the IOMMU and there is no rollout to survive.
#
# 'make iommu' still exists for a cluster built before this, and now finds
# nothing to do on one built after it.
- name: Enable the IOMMU from the first boot
  ansible.builtin.template:
    src: gpu-passthrough-machineconfig.yaml.j2
    dest: "{{ install_dir }}/manifests/99-{{ iommu_machine_config_name }}.yaml"
    mode: '0644'

- name: Create ignition configs
  ansible.builtin.command: "{{ bin_dir }}/openshift-install create ignition-configs --dir {{ install_dir }}"
  args:
    creates: "{{ install_dir }}/bootstrap.ign"

- name: Publish bootstrap.ign and master.ign to the ignition server
  ansible.builtin.copy:
    src: "{{ install_dir }}/{{ item }}"
    dest: "{{ ignition_root }}/{{ item }}"
    remote_src: true
    mode: '0644'
  loop:
    - bootstrap.ign
    - master.ign
