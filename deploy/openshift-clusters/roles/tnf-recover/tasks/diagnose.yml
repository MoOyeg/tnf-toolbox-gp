---
# Everything the documentation asks you to look at, gathered once, before any
# of it is changed. If the ladder fails this is what is left to work from.

- name: Gather Pacemaker and etcd diagnostics
  ansible.builtin.shell: |
    set +e
    echo "=== pcs status --full ==="
    oc debug node/{{ tnf_survivor }} --quiet --request-timeout=180s -- \
      chroot /host pcs status --full 2>&1 | tail -40
    echo "=== pcs quorum status ==="
    oc debug node/{{ tnf_survivor }} --quiet --request-timeout=120s -- \
      chroot /host pcs quorum status 2>&1 | tail -15
    echo "=== corosync membership ==="
    oc debug node/{{ tnf_survivor }} --quiet --request-timeout=120s -- \
      chroot /host corosync-quorumtool -s 2>&1 | tail -15
    echo "=== stonith configuration ==="
    oc debug node/{{ tnf_survivor }} --quiet --request-timeout=120s -- \
      chroot /host pcs stonith config 2>&1 | tail -25
    echo "=== pacemaker journal, etcd resource ==="
    oc debug node/{{ tnf_survivor }} --quiet --request-timeout=180s -- \
      chroot /host bash -c 'journalctl -u pacemaker --no-pager | grep podman-etcd | tail -20' 2>&1
  environment:
    KUBECONFIG: "{{ op_kubeconfig | default(kubeconfig) }}"
  register: tnf_diagnostics
  changed_when: false
  failed_when: false

- name: Show them
  ansible.builtin.debug:
    msg: "{{ tnf_diagnostics.stdout_lines }}"
