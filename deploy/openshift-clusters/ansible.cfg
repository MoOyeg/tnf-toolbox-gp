[defaults]
# 'yaml' as a stdout_callback resolved to community.general.yaml, which was
# removed in community.general 12. The built-in default callback has produced
# the same output through result_format since ansible-core 2.13.
stdout_callback = default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
host_key_checking = False
roles_path = ./roles
collections_path = ./collections
# The installer and operator waits run for hours; keep the log so a failure
# late in a run can still be read back.
log_path = ../../logs/ansible.log
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30
