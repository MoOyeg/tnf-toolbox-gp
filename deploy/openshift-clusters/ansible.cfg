[defaults]
stdout_callback = yaml
callbacks_enabled = ansible.posix.profile_tasks, timer
host_key_checking = False
roles_path = ./roles
collections_path = ./collections
# The installer and the operator waits are long-running; keep the log so a
# failure hours in can still be read back.
log_path = ../../logs/ansible.log
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30
